# CI in two tiers (no specification governs this: our own design).
#
#   1. The workflow, shell and guard tier needs no Rust and runs on every
#      change.
#   2. The Rust tier runs when the workspace exists and has a member (the
#      `detect` job looks for the root Cargo.toml and a member manifest after
#      checkout, which hashFiles() at `if:` time cannot): fmt, clippy with and
#      without every feature, nextest and the doctests, rustdoc, cargo-deny,
#      the publish dry run. Cargo refuses most commands on a workspace with no
#      member, so until the first crate lands only the manifest is read.
#
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited`, `labeled` and `unlabeled` started a second run on
    # the same commit, the concurrency group cancelled the first, and its
    # `conclusion` reported a failure on the head commit (#133). The guards
    # read their labels and the description from the API when they run, and
    # pr-guards.yml re-runs the one a change affects once this run completes.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Tier 1 ---------------------------------------------------------------
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zizmor@1.31.1
      - name: Audit .github
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style

  # Every helper and guard proves its refusals against stubs and fixtures, so
  # a change to one never silently loosens it.
  self-tests:
    name: self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tracker helpers
        run: |
          set -euo pipefail
          for helper in fields rel project labels watch-prs changelog-merge; do
            bash "scripts/gh/$helper.sh" --self-test
          done
      - name: The guards
        run: |
          set -euo pipefail
          for guard in comment-style versions file-length todo-issues crate-version-guard changelog-guard changelog-released changelog-security contribution-licence docs-claims book-guard writing-style pin-freshness stray-literals console-bundle; do
            bash "scripts/checks/$guard.sh" --self-test
          done
      - name: The release milestone script refuses open items and closes only after every leg
        run: bash scripts/release/milestone.sh --self-test
      - name: The release plan orders tags by version and counts the support period
        run: bash scripts/release/plan.sh --self-test
      - name: The destructive-command hook
        run: |
          set -euo pipefail
          if [ -f .claude/hooks/block_dangerous.sh ]; then
            bash .claude/hooks/block_dangerous.sh --self-test
          fi

  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # Every word the operator console draws is a message of its catalog under
  # app/ferropix-console/locales/; a literal that reads as words is refused,
  # and one no reader sees is allowed with its reason in
  # scripts/checks/stray-literals.allow. It reads the checkout alone.
  stray-literals:
    name: stray-literals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/stray-literals.sh app/ferropix-console/src

  # The pin matrix, the vendored trees and the licence headers.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/versions.sh

  file-length:
    name: file-length
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/file-length.sh

  # Every TODO(#N) names an open issue.
  todo-issues:
    name: todo-issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pending-work pointer names an open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh

  # Every released section of CHANGELOG.md reads as it did at its tag, every
  # section holds Keep a Changelog types each once, and [Unreleased] keeps
  # the Security rules the release plan checks on the section it cuts.
  changelog-released:
    name: changelog-released
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash scripts/checks/changelog-released.sh
      - run: bash scripts/checks/changelog-structure.sh
      # Regulation (EU) 2024/2847 Annex I Part II(2), (4) and (8): every
      # Security entry names its GHSA advisory or VEX statement, and a
      # Security section beside other changes opens with its reason.
      - run: bash scripts/checks/changelog-security.sh --section Unreleased

  # A pull request records its user-visible effect under [Unreleased], or
  # carries the `no-changelog` label.
  changelog-guard:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The change carries a changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#133).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-changelog")')" = true ]; then
            echo "the no-changelog label is set: the guard does not apply"
            exit 0
          fi
          bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"

  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the
  # template's checkbox. Bots are skipped: a bot cannot accept terms. The
  # body is read when the step runs, and pr-guards.yml re-runs this job when
  # the description changes, so ticking the box takes effect (#133).
  contribution-licence:
    name: contribution-licence
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the description when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_BODY=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq '.body // ""')
          export PR_BODY
          bash scripts/checks/contribution-licence.sh

  # The product version and each published crate's own version agree with the
  # lock and the changelog; the guard says so itself while there is no
  # workspace.
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The product line, the crate lines, the lock and the changelog agree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#133).
          NO_CRATE_BUMP=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-crate-bump")')
          export NO_CRATE_BUMP
          bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  # The site link guard: the book's sources linted, and the site assembled as
  # the Docs workflow publishes it, the landing page at the root and the book
  # under /docs/, with every internal link and anchor resolved offline, and
  # README.md against the tree. It sits here, in the required conclusion,
  # because the Docs workflow's build is no required check. --offline sends no
  # request: an external link is skipped. Its self-test proves a broken anchor
  # and a missing page fail.
  # The claims of the book that have a machine authority (every feature of
  # each published crate has its row, no page types a crate version, every
  # planned item links the tracker), and the mechanical half of the writing
  # style over the published prose.
  docs-claims:
    name: docs-claims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/checks/docs-claims.sh
          bash scripts/checks/writing-style.sh

  # A pull request that changes a user-visible surface (a crate's source or
  # features, the server, a deployment file) updates the book in the same
  # pull request, or carries the `no-book` label.
  book-guard:
    name: book-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The change updates the book with its surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#133).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-book")')" = true ]; then
            echo "the no-book label is set: the guard does not apply"
            exit 0
          fi
          bash scripts/checks/book-guard.sh "$BASE" "$HEAD"

  site-links:
    name: site-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docs-toolchain
      - run: |
          set -euo pipefail
          bash scripts/checks/site-links.sh --self-test
          bash scripts/checks/site-links.sh

  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.find.outputs.manifest }}
      cargo: ${{ steps.find.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          manifest=false
          cargo=false
          if [ -f Cargo.toml ]; then
            manifest=true
            # NOTE: no specification governs this: our own design; a directory
            # not yet created (tools/) must not fail the probe under pipefail.
            if { find crates app tools -mindepth 2 -maxdepth 2 -name Cargo.toml 2> /dev/null || true; } | grep -q .; then
              cargo=true
            fi
          fi
          {
            echo "manifest=$manifest"
            echo "cargo=$cargo"
          } >> "$GITHUB_OUTPUT"

  # ---- Tier 2 ---------------------------------------------------------------
  # The root manifest parses under the pinned toolchain, members or none.
  manifest:
    name: manifest
    needs: detect
    if: needs.detect.outputs.manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo metadata --no-deps --format-version 1 > /dev/null

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The operator console's browser half compiles for WebAssembly alone, so
  # the host clippy above never reads it; this lints the islands entry on its
  # own target, builds the release site bundle with the tools
  # docs/VERSIONS.md pins, and holds its entry WebAssembly to the budget of
  # .claude/rules/leptos-ui.md §4.
  console-wasm:
    name: console-wasm
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p ferropix-console --lib --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Install cargo-leptos
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-leptos@0.3.11
      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@0.2.129
      # Pinned and checked against its SHA-256 before use, so cargo-leptos
      # finds it on PATH and never downloads it itself.
      - name: Install wasm-opt
        run: |
          bash scripts/release/console-tools.sh "$RUNNER_TEMP/console-tools"
          echo "$RUNNER_TEMP/console-tools/bin" >> "$GITHUB_PATH"
      - run: bash scripts/release/console-site.sh --release
      # The sizes go to the job summary, and the step fails over the budget.
      - name: Measure the bundle against its budget
        run: bash scripts/checks/console-bundle.sh

  test:
    name: nextest
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=warn
      - run: cargo nextest run --workspace --all-features --locked --no-tests=warn
      - run: cargo test --doc --workspace --all-features --locked

  # The container cases of the testkit behind FERROPIX_E2E (#65): PostgreSQL
  # 18 and the stub OpenID Provider, started from the digests docs/VERSIONS.md
  # pins on the runner's Docker. Without the gate they pass at once in the
  # nextest job above; this is the run where they do their work.
  e2e:
    name: e2e
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FERROPIX_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p ferropix-testkit --locked -E 'test(/e2e::/)'

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --all-features --no-deps --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - run: cargo deny check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        run: bash scripts/checks/advisory-exceptions.sh
      # A VEX statement whose published argument names the wrong dependency
      # path: compared with the graph cargo resolves, in both directions.
      - name: Every VEX statement names the real dependency path
        run: bash scripts/checks/vex-reachability.sh

  # The published Rust advisory VEX is exactly what deny.toml and
  # security/vex/rust-advisories.toml generate, and every hand-written
  # OpenVEX document is well formed. No specification governs the gate: our
  # own design, the one FerroEHR, FerroFED and FerroUI run.
  vex:
    name: vex
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml and the prose file are TOML, which jq cannot read. Pinned by
      # version and verified by checksum: this binary decides whether the gate
      # passes.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
          yq --version
      - name: Every accepted advisory has a published VEX justification
        run: bash scripts/checks/vex-advisories.sh

  # No cache: the dry run checks the bytes a publish would upload. The
  # published set is the list scripts/release/publish-crates.sh holds.
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Every published crate packages
        run: |
          set -euo pipefail
          crates="$(bash scripts/release/publish-crates.sh list)"
          if [ -z "$crates" ]; then
            echo "no published crate yet; nothing to package"
            exit 0
          fi
          while IFS= read -r crate; do
            cargo publish -p "$crate" --dry-run --locked
          done <<< "$crates"

  # Each published crate is one specification with a feature per profile, so
  # every feature, and every profile with its audit feature, must lint and
  # test on its own as well as in the workspace union (the Cargo reference,
  # Features; no specification governs the layout: our own design).
  features:
    name: features (${{ matrix.package }} ${{ matrix.features }})
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ihe-iti, features: pixm }
          - { package: ihe-iti, features: pdqm }
          - { package: ihe-iti, features: mcsd }
          - { package: ihe-iti, features: pmir }
          - { package: ihe-iti, features: xcpd }
          - { package: ihe-iti, features: balp }
          - { package: ihe-iti, features: atna }
          - { package: ihe-iti, features: "pixm,balp" }
          - { package: ihe-iti, features: "pdqm,balp" }
          - { package: ihe-iti, features: "mcsd,balp" }
          - { package: ihe-iti, features: "pmir,balp" }
          - { package: ihe-iti, features: "xcpd,atna" }
          - { package: ihe-iti, features: pixm-server }
          - { package: ihe-iti, features: pdqm-server }
          - { package: nl-generic-functions, features: authorizer }
          - { package: nl-generic-functions, features: nvi }
          - { package: nl-generic-functions, features: mitz }
          - { package: nl-generic-functions, features: lrza }
          - { package: nl-generic-functions, features: nuts-auth }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Lint the feature set on its own
        env:
          PACKAGE: ${{ matrix.package }}
          FEATURES: ${{ matrix.features }}
        run: cargo clippy -p "$PACKAGE" --all-targets --no-default-features --features "$FEATURES" --locked -- -D warnings
      - name: Test the feature set on its own
        env:
          PACKAGE: ${{ matrix.package }}
          FEATURES: ${{ matrix.features }}
        run: cargo nextest run -p "$PACKAGE" --no-default-features --features "$FEATURES" --locked --no-tests=warn

  # Every IHE section a tracked file cites exists in the vendored text of that
  # profile and version. The RESTful ATNA supplement is a PDF, read with
  # pdftotext, so poppler-utils comes from the runner's own archive.
  ihe-citations:
    name: ihe-citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: |
          set -euo pipefail
          bash scripts/checks/ihe-citations.sh --self-test
          bash scripts/checks/ihe-citations.sh

  dependency-review:
    name: dependency-review
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - workflow-audit
      - workflow-lint
      - shellcheck
      - self-tests
      - comment-style
      - stray-literals
      - versions
      - file-length
      - todo-issues
      - changelog-released
      - changelog-guard
      - contribution-licence
      - crate-version-guard
      - detect
      - manifest
      - fmt
      - clippy
      - console-wasm
      - test
      - e2e
      - doc
      - cargo-deny
      - vex
      - publish-dry-run
      - features
      - ihe-citations
      - dependency-review
      - site-links
      - docs-claims
      - book-guard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
