# CI in two tiers (no specification governs this: our own design).
#
#   1. The workflow, shell and guard tier needs no Rust and runs on every
#      change.
#   2. The Rust tier runs when the workspace exists and has a member (the
#      `detect` job looks for the root Cargo.toml and a member manifest after
#      checkout, which hashFiles() at `if:` time cannot): fmt, clippy with and
#      without every feature, nextest and the doctests, rustdoc, cargo-deny,
#      the publish dry run. Cargo refuses most commands on a workspace with no
#      member, so until the first crate lands only the manifest is read.
#
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited`, `labeled` and `unlabeled` started a second run on
    # the same commit, the concurrency group cancelled the first, and its
    # `conclusion` reported a failure on the head commit (#133). The guards
    # read their labels from the API when they run, and
    # pr-guards.yml re-runs the one a change affects once this run completes.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's runs share one group per ref, and a new commit cancels
  # the run it replaces. Every other run gets a group of its own, because a
  # group holds one pending run and a newer one cancels it whatever
  # cancel-in-progress says, which dropped pushes to main (#555).
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Tier 1 ---------------------------------------------------------------

  # The workflow and container linters in one job: each linter is a step
  # that runs whatever the step before it concluded, so one run reports
  # every finding, and the job takes one runner where it took four (#553).
  # No specification governs this: our own design.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- zizmor ------------------------------------------------------
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: zizmor@1.32.0
      - name: zizmor / Audit .github
        if: ${{ !cancelled() }}
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

      # ---- actionlint --------------------------------------------------
      - name: actionlint / Lint .github/workflows
        if: ${{ !cancelled() }}
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # ---- shellcheck --------------------------------------------------
      - name: shellcheck
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck / Every tracked shell program is clean at severity=style
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style

      # ---- hadolint ----------------------------------------------------
      # hadolint over every tracked Dockerfile, under the committed .hadolint.yaml
      # (failure-threshold: warning).
      - name: hadolint / Every tracked Dockerfile passes hadolint
        if: ${{ !cancelled() }}
        # The official image, digest-pinned, for the same reason as actionlint:
        # hadolint is a Haskell binary with no checksum-verified installer in
        # the pinned tool set.
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(git ls-files -z 'Dockerfile' '*/Dockerfile' '*.Dockerfile' 'Dockerfile.*')
          printf 'checking: %s\n' "${files[@]}"
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --config .hadolint.yaml "${files[@]}"

  # The committed guards in one job: each guard is a step that runs
  # whatever the step before it concluded, so one run reports every
  # finding, and the job takes one runner where it took sixteen (#553).
  # No specification governs this: our own design.
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changelog-released reads every release tag.
          fetch-depth: 0

      # ---- self-tests --------------------------------------------------
      # Every helper and guard proves its refusals against stubs and fixtures, so
      # a change to one never silently loosens it.
      - name: self-tests / The tracker helpers
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for helper in fields rel project labels watch-prs changelog-merge; do
            bash "scripts/gh/$helper.sh" --self-test
          done
      - name: self-tests / The guards
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for guard in comment-style versions file-length todo-issues crate-version-guard semver changelog-guard changelog-released changelog-security changelog-structure docs-claims book-guard writing-style pin-freshness stray-literals usage-report-off conformance vex-coverage; do
            bash "scripts/checks/$guard.sh" --self-test
          done
      - name: self-tests / The performance gate reads its pins, renders its plan, resolves its base and holds its two idle tables equal
        if: ${{ !cancelled() }}
        run: bash scripts/perf/gate.sh --self-test
      - name: self-tests / The quickstart tour holds every anchor the book includes, and the README shows each as the script holds it
        if: ${{ !cancelled() }}
        run: bash scripts/quickstart/tour.sh --self-test
      - name: self-tests / The release milestone script refuses open items and closes only after every leg
        if: ${{ !cancelled() }}
        run: bash scripts/release/milestone.sh --self-test
      - name: self-tests / The release plan orders tags by version and counts the support period
        if: ${{ !cancelled() }}
        run: bash scripts/release/plan.sh --self-test
      - name: self-tests / The changelog assembler checks fragments and cuts them into a release
        if: ${{ !cancelled() }}
        run: bash scripts/release/changelog.sh --self-test
      - name: self-tests / The release staging checks each tarball and stages the 0700 spool
        if: ${{ !cancelled() }}
        run: bash scripts/release/stage-dist.sh --self-test
      - name: self-tests / The chart comparison matches a repackaged chart and refuses other files
        if: ${{ !cancelled() }}
        run: bash scripts/release/chart-published.sh --self-test
      - name: self-tests / The Trivy install refuses a version with no sha256 and a tarball off its pin
        if: ${{ !cancelled() }}
        run: bash scripts/release/install-trivy.sh --self-test
      - name: self-tests / The destructive-command hook
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f .claude/hooks/block_dangerous.sh ]; then
            bash .claude/hooks/block_dangerous.sh --self-test
          fi

      # ---- comment-style -----------------------------------------------
      - name: comment-style
        if: ${{ !cancelled() }}
        run: bash scripts/checks/comment-style.sh --all

      # ---- stray-literals ----------------------------------------------
      # Every word the operator console draws is a message of its catalog under
      # app/ferropix-console/locales/; a literal that reads as words is refused,
      # and one no reader sees is allowed with its reason in
      # scripts/checks/stray-literals.allow. It reads the checkout alone.
      - name: stray-literals
        if: ${{ !cancelled() }}
        run: bash scripts/checks/stray-literals.sh app/ferropix-console/src

      # ---- versions ----------------------------------------------------
      # The pin matrix, the vendored trees and the licence headers.
      - name: versions
        if: ${{ !cancelled() }}
        run: bash scripts/checks/versions.sh

      # ---- file-length -------------------------------------------------
      - name: file-length
        if: ${{ !cancelled() }}
        run: bash scripts/checks/file-length.sh

      # ---- duplication -------------------------------------------------
      # The duplication ratchet: the duplicated lines of the hand-written Rust may
      # fall and never rise (`.claude/rules/rust-style.md` §Code is written once,
      # #392). jscpd runs from its pinned image; a fall passes with a note.
      - name: duplication / Duplication ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh --self-test
      - name: duplication / The duplicated lines have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh

      # ---- forwarders --------------------------------------------------
      # The forwarder ratchet: the functions whose whole body forwards to one
      # other call may fall and never rise (`.claude/rules/rust-style.md` §No
      # function only forwards to another, #403). tools/forwarders reads source
      # text only, so the job builds proc-macro2, quote and syn alone and takes
      # no build cache; a fall passes with a note.
      - name: forwarders
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: forwarders / Forwarder ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh --self-test
      - name: forwarders / The forwarders have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh

      # ---- usage-report-off --------------------------------------------
      # Every launcher of the server in a test lane switches the usage report off.
      - name: usage-report-off
        if: ${{ !cancelled() }}
        run: bash scripts/checks/usage-report-off.sh

      # ---- helm-chart --------------------------------------------------
      # The Helm chart: lint, render and kubeconform over every value set, the
      # Restricted fields and no rendered credential, with the script's
      # self-test; helm at the version docs/VERSIONS.md pins, its tarball checked
      # against its published SHA-256, and kubeconform from its official image,
      # pinned by tag and digest, so no GitHub release is fetched per run (#545).
      - name: helm-chart / Install helm and kubeconform
        if: ${{ !cancelled() }}
        env:
          HELM_VERSION: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_DIGEST: sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          image="ghcr.io/yannh/kubeconform:v${KUBECONFORM_VERSION}@${KUBECONFORM_DIGEST}"
          docker pull -q "$image"
          sudo tee /usr/local/bin/kubeconform > /dev/null <<WRAPPER
          #!/usr/bin/env bash
          exec docker run --rm -i "$image" "\$@"
          WRAPPER
          sudo chmod 0755 /usr/local/bin/kubeconform
          helm version --short
          kubeconform -v
      - name: helm-chart
        if: ${{ !cancelled() }}
        run: bash deploy/helm/validate.sh
      - name: helm-chart
        if: ${{ !cancelled() }}
        run: bash deploy/helm/validate.sh --self-test
      - name: helm-chart / The config check of the rendered chart refuses a key its image refuses
        if: ${{ !cancelled() }}
        run: bash deploy/helm/config-check.sh --self-test

      # ---- todo-issues -------------------------------------------------
      # Every TODO(#N) names an open issue.
      - name: todo-issues / Every pending-work pointer names an open issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh

      # ---- changelog-released ------------------------------------------
      # Every released section of CHANGELOG.md reads as it did at its tag, every
      # section holds Keep a Changelog types each once, and [Unreleased] keeps
      # the Security rules the release plan checks on the section it cuts.
      - name: changelog-released
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-released.sh
      - name: changelog-released
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-structure.sh
      # Every fragment under changelog.d/ is well formed (changelog.d/README.md).
      - name: changelog-released
        if: ${{ !cancelled() }}
        run: bash scripts/release/changelog.sh --check
      # Regulation (EU) 2024/2847 Annex I Part II(2), (4) and (8): every
      # Security entry names its GHSA advisory or VEX statement, and a
      # Security section beside other changes opens with its reason. Checked
      # over [Unreleased] with every fragment folded in, as the next cut
      # writes it; the release plan runs the same check over the section it
      # cuts.
      - name: changelog-released
        if: ${{ !cancelled() }}
        run: bash scripts/release/changelog.sh --check-preview

      # ---- docs-claims -------------------------------------------------
      # The site link guard: the book's sources linted, and the site assembled as
      # the Docs workflow publishes it, the landing page at the root and the book
      # under /docs/, with every internal link and anchor resolved offline, and
      # README.md against the tree. It sits here, in the required conclusion,
      # because the Docs workflow's build is no required check. --offline sends no
      # request: an external link is skipped. Its self-test proves a broken anchor
      # and a missing page fail.
      # The claims of the book that have a machine authority (every feature of
      # each published crate has its row, no page types a crate version, every
      # planned item links the tracker), and the mechanical half of the writing
      # style over the published prose.
      - name: docs-claims
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/checks/docs-claims.sh
          bash scripts/checks/writing-style.sh

      # ---- site-links --------------------------------------------------
      - name: site-links
        if: ${{ !cancelled() }}
        uses: ./.github/actions/docs-toolchain
      - name: site-links
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/checks/site-links.sh --self-test
          bash scripts/checks/site-links.sh

      # ---- vex ---------------------------------------------------------
      # The published Rust advisory VEX is exactly what deny.toml and
      # security/vex/rust-advisories.toml generate, and every hand-written
      # OpenVEX document is well formed. No specification governs the gate: our
      # own design, the one FerroEHR, FerroFED and FerroUI run.
      - name: vex / The runner's yq is new enough
        if: ${{ !cancelled() }}
        env:
          YQ_MIN_VERSION: v4.54.1
        run: bash scripts/checks/runner-yq.sh
      - name: vex / Every accepted advisory has a published VEX justification
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vex-advisories.sh

      # ---- ihe-citations -----------------------------------------------
      # Every IHE section a tracked file cites exists in the vendored text of that
      # profile and version. The RESTful ATNA supplement is a PDF, read with
      # pdftotext, so poppler-utils comes from the runner's own archive.
      - name: ihe-citations / Install pdftotext
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: ihe-citations
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/checks/ihe-citations.sh --self-test
          bash scripts/checks/ihe-citations.sh

      # ---- conflict-markers --------------------------------------------
      # No tracked file keeps an unresolved merge conflict (#436; no
      # specification governs the guard: our own design).
      - name: conflict-markers / The guard refuses each marker and skips the vendored trees
        if: ${{ !cancelled() }}
        run: bash scripts/checks/conflict-markers.sh --self-test
      - name: conflict-markers
        if: ${{ !cancelled() }}
        run: bash scripts/checks/conflict-markers.sh

  # A pull request with a user-visible effect adds a fragment under
  # changelog.d/ (changelog.d/README.md), and no pull request writes under
  # CHANGELOG.md's [Unreleased], the lines open pull requests used to conflict
  # on. The `no-changelog` label waives the entry, never the [Unreleased]
  # refusal.
  changelog-guard:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The change carries a changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#133).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-changelog")')" = true ]; then
            echo "the no-changelog label is set: the entry is waived, an [Unreleased] edit is still refused"
            bash scripts/checks/changelog-guard.sh --waived "$BASE" "$HEAD"
            exit 0
          fi
          bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"

  # The product version and each published crate's own version agree with the
  # lock and the changelog; the guard says so itself while there is no
  # workspace. A crate version that moves takes one SemVer step, and a public
  # dependency on another compatibility line moves it off its own line. On a
  # pull request and in the merge queue, each crate the guard names is then
  # judged by cargo-semver-checks against the same base
  # (scripts/checks/semver.sh, #586): a breaking change bumps the minor while
  # the crate is 0.x. The toolchain is installed only when a crate is judged.
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: guard-pr
        name: The product line, the crate lines, the lock and the changelog agree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#133).
          NO_CRATE_BUMP=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-crate-bump")')
          export NO_CRATE_BUMP
          bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"
      # The queue builds each entry onto the one ahead of it and names that as
      # the base, so the diff is this entry's change alone. The group ref names
      # the pull request (`gh-readonly-queue/main/pr-<n>-<sha>`), whose label
      # is the same escape.
      - id: guard-queue
        name: The queued change keeps the version lines against the queue base
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          pr="$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$GROUP_REF")"
          NO_CRATE_BUMP=false
          if [ -n "$pr" ] && gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'no-crate-bump'; then
            NO_CRATE_BUMP=true
          fi
          export NO_CRATE_BUMP
          bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"
      - uses: ./.github/actions/setup-rust
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        with:
          cache-save-if: "false"
      - id: semver-pin
        name: Read the cargo-semver-checks pin
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        run: echo "version=$(bash scripts/checks/semver.sh --pin)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        with:
          tool: cargo-semver-checks@${{ steps.semver-pin.outputs.version }}
      # The checkout is the change merged onto its base, so the judge compares
      # the base's public API with the one the merge would leave.
      - name: Each moved crate's version answers its change (cargo-semver-checks)
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        env:
          JUDGED: ${{ steps.guard-pr.outputs.judged }}${{ steps.guard-queue.outputs.judged }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one crate name per word by construction
          bash scripts/checks/semver.sh --baseline-rev "$BASE" $JUDGED

  # A pull request that changes a user-visible surface (a crate's source or
  # features, the server, a deployment file) updates the book in the same
  # pull request, or carries the `no-book` label.
  book-guard:
    name: book-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The change updates the book with its surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#133).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-book")')" = true ]; then
            echo "the no-book label is set: the guard does not apply"
            exit 0
          fi
          bash scripts/checks/book-guard.sh "$BASE" "$HEAD"

  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.find.outputs.manifest }}
      cargo: ${{ steps.find.outputs.cargo }}
      perf: ${{ steps.perf.outputs.perf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The first parent of a pull request's merge commit and of a merge
          # group's commit is its base, which the perf probe diffs against.
          fetch-depth: 2
      - id: find
        run: |
          set -euo pipefail
          manifest=false
          cargo=false
          if [ -f Cargo.toml ]; then
            manifest=true
            # NOTE: no specification governs this: our own design; a directory
            # not yet created (tools/) must not fail the probe under pipefail.
            if { find crates app tools -mindepth 2 -maxdepth 2 -name Cargo.toml 2> /dev/null || true; } | grep -q .; then
              cargo=true
            fi
          fi
          {
            echo "manifest=$manifest"
            echo "cargo=$cargo"
          } >> "$GITHUB_OUTPUT"
      # The performance gate runs on a push to main, on a dispatch, and on a
      # pull request or merge group that changes what the server is built
      # from or what the gate reads (#506).
      - id: perf
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          perf=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if ! grep -qE '^(app/ferropix-server/|app/ferropix-operator-api/|crates/|tools/ferropix-testkit/fixtures/|perf/|scripts/perf/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|docs/VERSIONS\.md$|\.github/workflows/(ci|perf)\.yml$|\.github/actions/setup-rust/)' <<< "$changed"; then
              perf=false
            fi
          fi
          echo "perf=$perf" >> "$GITHUB_OUTPUT"

  # ---- Tier 2 ---------------------------------------------------------------
  # The root manifest parses under the pinned toolchain, members or none.
  manifest:
    name: manifest
    needs: detect
    if: needs.detect.outputs.manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo metadata --no-deps --format-version 1 > /dev/null

  # fuzz/ is its own workspace with its own lockfile, outside every cargo
  # command above, and its path dependency inherits versions from the root
  # manifest. A crate bump or a dependency change that leaves fuzz/Cargo.lock
  # behind would fail only the scheduled fuzz run, so the lock is held here.
  fuzz-lockfile:
    name: fuzz-lockfile
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: fuzz/Cargo.lock resolves the fuzz crate unchanged
        run: |
          if ! cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null; then
            echo "::error::fuzz/Cargo.lock is out of step: run 'cargo metadata --format-version 1 --manifest-path fuzz/Cargo.toml' and commit the lock it rewrites." >&2
            exit 1
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The operator console's browser journeys (#97, #98; no specification
  # governs them: our own design). Each journey checks FERROPIX_JOURNEYS
  # first and returns at once without it, so the nextest job needs no
  # browser; this job sets the gate and drives headless Chrome through
  # chromedriver, both at the Chrome for Testing release docs/VERSIONS.md
  # pins, against the console run in process over the test OpenID Provider
  # and a stand-in server, with FerroUI's script modules running and with
  # them withheld.
  journeys:
    name: journeys
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FERROPIX_JOURNEYS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      - name: Install Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 157.0.8103.38
          install-chromedriver: true
      # Each journey starts a chromedriver of its own on a port the system
      # picks and stops it with its session, so they run in parallel.
      - name: Run the journeys
        env:
          FERROPIX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROPIX_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo nextest run --locked -p ferropix-testkit -E 'test(/^journeys::/)'
      # A failed wait leaves a screenshot and the whole document; a passing
      # run writes nothing, so this attaches only where there is something to
      # look at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: journey-failures
          path: target/journey-failures
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: nextest
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=warn
      - run: cargo nextest run --workspace --all-features --locked --no-tests=warn
      - run: cargo test --doc --workspace --all-features --locked

  # The conformance gate (#162): the corpus tests of ihe-iti over every
  # example of the vendored PIXm, PDQm and PMIR packages, held to the pass
  # lists under conformance/, with the shields.io badge files and the README
  # block they render checked against those lists.
  conformance:
    name: conformance
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      - run: bash scripts/checks/conformance.sh --check

  # The container cases behind FERROPIX_E2E: the testkit's own (#65), PostgreSQL
  # 18 and the stub OpenID Provider, and the server's store against PostgreSQL
  # (#59), started from the digests docs/VERSIONS.md pins on the runner's
  # Docker. Without the gate they pass at once in the nextest job above; this
  # is the run where they do their work.
  e2e:
    name: e2e
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FERROPIX_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p ferropix-testkit -p ferropix-server --locked -E 'test(/e2e::/)'

  # The performance gate (#506): ferrohealth-perf's A/B mode, the release
  # build judged against the build of its base on the same runner, in
  # perf.yml, which the release lane calls on the release commit too. The
  # base is the pull request's base or the commit before a push; a dispatch
  # takes the previous release. A merge group builds nothing for it and its
  # verdict passes with a summary saying why (#551).
  perf:
    name: perf
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.perf == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/perf.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      skip: ${{ github.event_name == 'merge_group' }}

  # The quickstart, run as an operator runs it: the server built for the
  # static musl target, the image built from that binary through the staged
  # tree the release lane uses (scripts/release/stage-dist.sh), then
  # the book's quickstart tour (scripts/quickstart/tour.sh) over compose.yaml
  # as committed, the console included. It checks the image's tree (the binary root-owned 0555, the state directory and its
  # 0700 audit spool owned by 65532), readiness, the image's HEALTHCHECK, and
  # a token of the development issuer read by the server, and the Helm
  # chart's rendered configuration through the config check of the server
  # and console images built here (deploy/helm/config-check.sh). A debug build: the
  # job proves the packaging, and the release lane builds what ships. The
  # usage report is off for every server this job starts.
  quickstart:
    name: quickstart
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      FERROPIX__USAGE_REPORT__ENABLED: "false"
      FERROPIX_VERSION: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose.yaml resolves, with and without the console, with its healthchecks
        run: |
          set -euo pipefail
          mkdir -p secrets
          for secret in ferropix-db-url ferropix-data-key postgres-password ferropix-db-password console-oidc-client-secret; do
            : > "secrets/${secret}"
          done
          docker compose config --quiet
          docker compose --profile console config --quiet
          docker compose --profile hl7v2 config --quiet
          # The healthchecks sit on the services, since Podman runs the
          # published images without theirs (#292).
          docker compose --profile console config --format json \
            | jq -e '.services.ferropix.healthcheck.test and .services.console.healthcheck.test' > /dev/null \
            || { echo "::error::compose.yaml declares no healthcheck on the server or the console" >&2; exit 1; }
      # The console image from placeholder files at the paths
      # release-console.yml stages: a COPY path or a .dockerignore rule that
      # misses the staged tree fails here, and the tree carries the owners and
      # modes the Dockerfile promises. Its real binary and bundle are built
      # by the release lane alone.
      - name: docker/console/Dockerfile builds from a staged tree
        run: |
          set -euo pipefail
          mkdir -p dist/console/linux_amd64
          : > dist/console/linux_amd64/ferropix-console
          docker buildx build --check -f docker/console/Dockerfile .
          docker buildx build --platform linux/amd64 --load -t ferropix-console:dry-run -f docker/console/Dockerfile .
          id="$(docker create ferropix-console:dry-run)"
          listing="$(docker export "$id" | tar -tvf -)"
          docker rm "$id" > /dev/null
          grep -qE '^-r-xr-xr-x 0/0 .* usr/local/bin/ferropix-console$' <<< "$listing" \
            || { echo "::error::the console image lacks its binary, root-owned 0555" >&2; exit 1; }
          ! grep -qE ' site/' <<< "$listing" \
            || { echo "::error::the console image carries a site bundle it no longer serves" >&2; exit 1; }
          [ "$(docker image inspect --format '{{.Config.User}}' ferropix-console:dry-run)" = "65532:65532" ] \
            || { echo "::error::the console image does not run as 65532:65532" >&2; exit 1; }
          docker image rm ferropix-console:dry-run > /dev/null
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-unknown-linux-musl
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build the server for the static target
        run: cargo build --locked -p ferropix-server --target x86_64-unknown-linux-musl
      - name: Build the image from the staged tree
        run: |
          set -euo pipefail
          mkdir -p dist/linux_amd64
          install -m 0555 target/x86_64-unknown-linux-musl/debug/ferropix dist/linux_amd64/ferropix
          bash scripts/release/stage-dist.sh tree
          docker buildx build --check -f docker/Dockerfile .
          docker buildx build --platform linux/amd64 --load \
            -t "ghcr.io/ferrohealth/ferropix:${FERROPIX_VERSION}" -f docker/Dockerfile .
      - name: The image carries its tree with the owners and modes it promises
        run: |
          set -euo pipefail
          id="$(docker create "ghcr.io/ferrohealth/ferropix:${FERROPIX_VERSION}")"
          listing="$(docker export "$id" | tar -tvf -)"
          docker rm "$id" > /dev/null
          want() {
            local pattern="$1" what="$2"
            grep -qE "$pattern" <<< "$listing" || { echo "::error::the image lacks ${what}" >&2; exit 1; }
          }
          want '^-r-xr-xr-x 0/0 .* usr/local/bin/ferropix$' "the binary, root-owned 0555"
          want '^d[rwx-]{9} 65532/65532 .* var/lib/ferropix/$' "/var/lib/ferropix owned by 65532"
          want '^drwx------ 65532/65532 .* var/lib/ferropix/audit/$' "the audit spool, 0700, owned by 65532"
          [ "$(docker image inspect --format '{{.Config.User}}' "ghcr.io/ferrohealth/ferropix:${FERROPIX_VERSION}")" = "65532:65532" ] \
            || { echo "::error::the image does not run as 65532:65532" >&2; exit 1; }
      # The chart over every value set under deploy/helm/ci, its defaults with
      # only the required inputs among them, held to the configuration
      # contract of the server and console images built from this tree: each
      # image's `config check` over the configuration the chart renders (#585).
      - name: Build the console for the static target
        run: cargo build --locked -p ferropix-console --target x86_64-unknown-linux-musl
      - name: Build the console image from the staged tree
        run: |
          set -euo pipefail
          mkdir -p dist/console/linux_amd64
          install -m 0555 target/x86_64-unknown-linux-musl/debug/ferropix-console dist/console/linux_amd64/ferropix-console
          docker buildx build --platform linux/amd64 --load \
            -t "ghcr.io/ferrohealth/ferropix-console:${FERROPIX_VERSION}" -f docker/console/Dockerfile .
      - name: Install helm
        env:
          HELM_VERSION: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: The images accept the configuration the chart renders
        run: |
          bash deploy/helm/config-check.sh \
            --server "ghcr.io/ferrohealth/ferropix:${FERROPIX_VERSION}" \
            --console "ghcr.io/ferrohealth/ferropix-console:${FERROPIX_VERSION}"
      # The book's quickstart page shows the commands of this script by
      # anchor, so a command it shows is a command run here (#594).
      - name: The book's quickstart tour runs as written
        timeout-minutes: 10
        run: bash scripts/quickstart/tour.sh
      - name: The quickstart reaches readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/health/readiness
          echo
          docker compose exec -T ferropix /usr/local/bin/ferropix healthcheck
          docker compose logs ferropix | grep -F 'usage report OFF'
      - name: The server admits a token of the development issuer
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            -d grant_type=client_credentials -d client_id=quickstart-source \
            -d client_secret=any -d scope=system/Patient.rs \
            http://localhost:8180/ferropix/token | jq -r .access_token)"
          # An unknown source identifier is a 404 of ITI-83 (PIXm 3.1.0
          # §2:3.83.4.2.2.2); a refused token would be a 401.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "http://localhost:8080/fhir/Patient/\$ihe-pix?sourceIdentifier=urn:oid:2.999.1.1|0")"
          [ "$status" = "404" ] || { echo "::error::ITI-83 answered ${status}, not 404" >&2; exit 1; }
      - name: Logs of a failed start
        if: failure()
        run: docker compose --profile console logs --no-color
      - name: Stop the quickstart
        if: always()
        run: docker compose --profile console down --volumes

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --all-features --no-deps --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      - run: cargo deny check
      # fuzz/ is its own workspace with its own lockfile (#310): its licences,
      # advisories and sources are read against the same deny.toml.
      - name: cargo deny check over the fuzz workspace
        run: cargo deny --manifest-path fuzz/Cargo.toml check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        run: bash scripts/checks/advisory-exceptions.sh
      # A VEX statement whose published argument names the wrong dependency
      # path: compared with the graph cargo resolves, in both directions.
      - name: Every VEX statement names the real dependency path
        run: bash scripts/checks/vex-reachability.sh

  # No cache: the dry run checks the bytes a publish would upload. The
  # published set is the list scripts/release/publish-crates.sh holds.
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Every published crate packages
        run: bash scripts/release/publish-crates.sh dry-run
      - name: The crates package as one set, as the release lane packages them
        run: bash scripts/release/publish-crates.sh package "$RUNNER_TEMP/crates"

  # Each published crate is one specification with a feature per profile, so
  # every feature, and every profile with its audit feature, must lint and
  # test on its own as well as in the workspace union (the Cargo reference,
  # Features; no specification governs the layout: our own design).
  features:
    name: features (${{ matrix.package }} ${{ matrix.features }})
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ihe-iti, features: pixm }
          - { package: ihe-iti, features: pdqm }
          - { package: ihe-iti, features: mcsd }
          - { package: ihe-iti, features: pmir }
          - { package: ihe-iti, features: xcpd }
          - { package: ihe-iti, features: balp }
          - { package: ihe-iti, features: atna }
          - { package: ihe-iti, features: "pixm,balp" }
          - { package: ihe-iti, features: "pdqm,balp" }
          - { package: ihe-iti, features: "mcsd,balp" }
          - { package: ihe-iti, features: "pmir,balp" }
          - { package: ihe-iti, features: "xcpd,atna" }
          - { package: ihe-iti, features: pixm-server }
          - { package: ihe-iti, features: pdqm-server }
          - { package: ihe-iti, features: pmir-server }
          - { package: ihe-iti, features: soap }
          - { package: ihe-iti, features: outbound }
          - { package: nl-generic-functions, features: nvi }
          - { package: nl-generic-functions, features: mitz }
          - { package: nl-generic-functions, features: lrza }
          - { package: nl-generic-functions, features: nuts-auth }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      - name: Lint the feature set on its own
        env:
          PACKAGE: ${{ matrix.package }}
          FEATURES: ${{ matrix.features }}
        run: cargo clippy -p "$PACKAGE" --all-targets --no-default-features --features "$FEATURES" --locked -- -D warnings
      - name: Test the feature set on its own
        env:
          PACKAGE: ${{ matrix.package }}
          FEATURES: ${{ matrix.features }}
        run: cargo nextest run -p "$PACKAGE" --no-default-features --features "$FEATURES" --locked --no-tests=warn

  dependency-review:
    name: dependency-review
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - lint
      - guards
      - changelog-guard
      - crate-version-guard
      - detect
      - manifest
      - fuzz-lockfile
      - fmt
      - clippy
      - journeys
      - test
      - conformance
      - e2e
      - perf
      - quickstart
      - doc
      - cargo-deny
      - publish-dry-run
      - features
      - dependency-review
      - book-guard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
