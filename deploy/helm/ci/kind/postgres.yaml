#
# The external PostgreSQL 18 the cluster check installs the chart against:
# the image compose.yaml pins, initialised with the quickstart's role script
# (docker/postgres/10-ferropix-role.sh), its passwords in the Secret the
# check writes. A test fixture, not a production database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          env:
            - name: POSTGRES_DB
              value: ferropix
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres-password
          # The kind check's database: bounded so a runaway query cannot take the node.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 1Gi
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "ferropix"]
            periodSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: passwords
              mountPath: /run/secrets/postgres-password
              subPath: postgres-password
            - name: passwords
              mountPath: /run/secrets/ferropix-db-password
              subPath: ferropix-db-password
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: passwords
          secret:
            secretName: postgres-passwords
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
