# Ratchet tighten (#392). No specification governs this: our own design,
# the rule FerroEHR adopted for its ratchet guards (FerroHEALTH/FerroEHR#4556).
#
# The ratchet guards (scripts/checks/duplication.sh and file-length.sh) fail
# a rise and pass a fall with a note, so a pull request that removes
# duplication or splits a file touches none of the shared ratchet files and
# conflicts with no other open pull request. This lane does the tightening
# instead: once a day it runs each guard's --update on main and opens one
# pull request that holds only the ratchet files, or moves its open one to
# the new counts. When nothing fell it does nothing.
#
# It is a pull request, never a push to main. The commit is made through the
# Git Data REST API, so GitHub signs it and it shows Verified
# (docs.github.com/en/rest/git/commits, "Signature verification").
#
# THE TOKEN. Events raised with GITHUB_TOKEN start no workflow run, so a pull
# request opened with it arrives with no checks and the required
# `conclusion` check never reports
# (docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication).
# A fine-grained PAT or GitHub App token with contents:write and
# pull-requests:write in RATCHET_TIGHTEN_TOKEN avoids that. Without it the
# lane still opens the pull request and says in its body to close and reopen
# it, or, where Actions may not open one, pushes the branch and ends with a
# notice and the body in the step summary.
name: Ratchet tighten

on:
  schedule:
    # Daily 04:53 UTC, off the hour and in a slot of its own; read the
    # slots with `grep -rE '^ +- cron:' .github/workflows/`.
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ratchet-tighten
  cancel-in-progress: false

jobs:
  tighten:
    name: tighten
    # The counts are main's; a dispatch from another branch would lower them
    # to that branch's tree.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the blob, tree, commit and branch ref
      pull-requests: write # open the pull request and arm its auto-merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A rise on main is a failure for a person to look at, never a count
      # this lane writes down.
      - name: No ratchet has risen on main
        run: |
          set -euo pipefail
          bash scripts/checks/duplication.sh
          bash scripts/checks/file-length.sh

      - name: Lower the counts
        id: update
        run: |
          set -euo pipefail
          count_before=$(git show HEAD:scripts/checks/duplication.count | awk '/^[[:space:]]*(#|$)/ { next } { print; exit }')
          bash scripts/checks/duplication.sh --update
          count_after=$(awk '/^[[:space:]]*(#|$)/ { next } { print; exit }' scripts/checks/duplication.count)
          # A block that moved and kept the count changes only its key, which
          # the check already tolerates; that alone is no reason for a PR.
          if [ "$count_before" = "$count_after" ]; then
            git checkout -- scripts/checks/duplication.count scripts/checks/duplication-baseline.txt
          fi
          bash scripts/checks/file-length.sh --update

          git status --porcelain --untracked-files=all -- \
            scripts/checks/duplication.count scripts/checks/duplication-baseline.txt \
            scripts/checks/file-length-allow.txt | awk '{ print $2 }' >changed-files.txt
          other=$(git status --porcelain --untracked-files=no | awk '{ print $2 }' | grep -vxF -f changed-files.txt || true)
          if [ -n "$other" ]; then
            echo "$other"
            echo "::error::--update changed a file outside the ratchet files."
            exit 1
          fi
          if [ ! -s changed-files.txt ]; then
            echo "::notice::No ratchet fell. Nothing to do."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=1" >>"$GITHUB_OUTPUT"
          {
            echo "duplication_before=$count_before"
            echo "duplication_after=$count_after"
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Ratchet files lowered'
            echo
            echo '```diff'
            git diff --stat
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Open or move the tightening pull request
        if: steps.update.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.RATCHET_TIGHTEN_TOKEN || github.token }}
          HAVE_TOKEN: ${{ secrets.RATCHET_TIGHTEN_TOKEN != '' && '1' || '0' }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          DUP_BEFORE: ${{ steps.update.outputs.duplication_before }}
          DUP_AFTER: ${{ steps.update.outputs.duplication_after }}
        run: |
          set -euo pipefail
          branch="chore/ratchet-tighten"

          # The parent is the commit the counts were measured on, so the
          # lowered counts hold for it; CI on the pull request measures them
          # again against main as it is at merge time.
          # Every request body goes through a file with --input, so no file
          # content passes through argv, whose single argument the kernel caps
          # (FerroHEALTH/FerroEHR#4790).
          base_tree=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq .tree.sha)
          printf '[]' >tree-entries.json
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -f "$f" ]; then
              base64 -w0 "$f" | jq -Rs '{encoding: "base64", content: .}' >blob.json
              blob=$(gh api "repos/${REPO}/git/blobs" --input blob.json --jq .sha)
              jq --arg path "$f" --arg sha "$blob" \
                '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' \
                tree-entries.json >tree-entries.next && mv tree-entries.next tree-entries.json
              echo "staged $f ($blob)"
            fi
          done <changed-files.txt
          jq --arg base "$base_tree" '{base_tree: $base, tree: .}' tree-entries.json >tree.json
          tree=$(gh api "repos/${REPO}/git/trees" --input tree.json --jq .sha)
          jq -n --arg tree "$tree" --arg parent "$BASE_SHA" \
            '{message: "chore(checks): lower the ratchet counts", tree: $tree, parents: [$parent]}' >commit.json
          commit=$(gh api "repos/${REPO}/git/commits" --input commit.json --jq .sha)

          # One pull request at a time: an open one moves to the new commit,
          # which is this lane's own branch and never main.
          open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            jq -n --arg sha "$commit" '{sha: $sha, force: true}' >ref.json
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" --input ref.json --jq .ref
            echo "::notice::Moved #${open} to ${commit}."
            exit 0
          fi
          if gh api "repos/${REPO}/git/ref/heads/${branch}" --silent 2>/dev/null; then
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
          fi
          jq -n --arg ref "refs/heads/${branch}" --arg sha "$commit" '{ref: $ref, sha: $sha}' >ref.json
          gh api "repos/${REPO}/git/refs" --input ref.json --jq .ref

          {
            echo "The ratchet guards pass a fall and fail only a rise, so pull requests leave the ratchet files alone (#392). This pull request records what fell on \`main\`, and carries only the ratchet files:"
            echo
            while IFS= read -r f; do echo "* \`$f\`"; done <changed-files.txt
            if [ -n "$DUP_BEFORE" ] && [ "$DUP_BEFORE" != "$DUP_AFTER" ]; then
              echo
              echo "Duplicated lines: ${DUP_BEFORE} to ${DUP_AFTER}."
            fi
            echo
            echo "Made by \`.github/workflows/ratchet-tighten.yml\` from each guard's \`--update\`. No user-visible change, so no changelog fragment."
            if [ "$HAVE_TOKEN" != "1" ]; then
              echo
              echo "No \`RATCHET_TIGHTEN_TOKEN\` is configured, so this pull request was opened with the workflow token and its checks did not start. Close and reopen it to raise them."
            fi
          } >pr-body.md

          # The organisation keeps "Allow GitHub Actions to create and approve
          # pull requests" off, so the workflow token may be refused; the
          # pushed branch is then the hand-off (FerroHEALTH/FerroEHR#4797).
          title="chore(checks): lower the ratchet counts"
          if ! url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
                       --title "$title" --body-file pr-body.md); then
            {
              echo "### Open the pull request by hand"
              echo
              echo "Branch \`${branch}\`, title \`${title}\`, body:"
              echo
              cat pr-body.md
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::notice::Pushed ${branch}; Actions may not open its pull request here. Open it by hand with the title \"${title}\" and the body in this run's summary."
            exit 0
          fi
          echo "::notice::Opened $url"
          echo "$url" >>"$GITHUB_STEP_SUMMARY"
          gh pr merge "$url" --repo "$REPO" --auto
