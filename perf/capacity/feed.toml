# A step of the capacity campaign (scripts/perf/capacity.sh, #740): one open-loop
# phase at the rate the script sets, against the seeded store. The idle
# table is a token one; the campaign judges latency and throughput, not
# idleness. No specification governs this: our own design.

[idle]
duration_secs = 5
max_cpu_percent = 100.0
max_transactions_per_second = 100000.0
settle_secs = 1

[load]
rate = 1.0
warmup_secs = 15
duration_secs = 60
max_in_flight = 2048
settle_secs = 2

[[requests]]
group = "pixm-feed"
method = "PUT"
path = "/fhir/Patient?identifier=urn%3Aoid%3A2.999.1.1%7CC-0500000"
status = 200
body = '{"resourceType":"Patient","identifier":[{"system":"urn:oid:2.999.1.1","value":"C-0500000"}],"active":true,"name":[{"use":"official","family":"Proefikink","given":["Xena"]}],"gender":"female","birthDate":"1987-04-10","address":[{"use":"home","line":["Synthetische straat 200"],"city":"Teststad","postalCode":"2070 CN","country":"NL"}]}'
headers = { authorization = "Bearer {source_token}", content-type = "application/fhir+json" }
