[package]
name = "ihe-iti"
description = "The IHE IT Infrastructure (ITI) profiles: PIXm (ITI-83), PDQm (ITI-78), mCSD (ITI-90), PMIR (ITI-93, ITI-94) and XCPD (ITI-55), one feature per profile"
# The crate line starts above the 0.0.0 name reservation on crates.io (no
# specification governs this: our own design).
version = "0.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ihe-iti"
readme = "README.md"
keywords = ["ihe", "fhir", "pixm", "mcsd", "health"]
categories = ["api-bindings", "science"]
# The workspace switch decides whether this crate is publishable
# (no specification governs this: our own design); include is the packaged
# content.
publish.workspace = true
include = ["src/**", "README.md", "LICENSE"]

# One crate for the IHE ITI Technical Framework, one feature per profile
# (no specification governs this: our own design). The crate depends on nothing
# in FerroFED, and only `xcpd` may ever carry the SOAP 1.2, HL7 v3 and SAML
# XUA stack.
[features]
# PIXm, the patient identifier cross-reference (ITI-83, #42): the HTTP client,
# the FHIR R4 `terminology` root set for Parameters and OperationOutcome, and
# the redacting secret type the identifiers travel in.
pixm = [
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/terminology",
  "dep:http",
  "dep:reqwest",
  "dep:secrecy",
  "dep:serde_json",
  "dep:thiserror",
  "dep:url",
]
# PDQm, the patient demographics query (ITI-78, #119): the HTTP client, the
# FHIR R4 `resources` root set for the Patient resources a search answers with,
# and the redacting secret type the demographics travel in.
pdqm = [
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:http",
  "dep:reqwest",
  "dep:secrecy",
  "dep:serde_json",
  "dep:thiserror",
  "dep:url",
]
# mCSD, the care services directory (ITI-90): the FHIR R4 `resources` root set
# for the Organization and Endpoint resources a directory publishes (#74), and
# the URL parser the redacted `Debug` of an entry reads its URLs with; the
# ITI-90 client follows with #86.
mcsd = [
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:serde_json",
  "dep:thiserror",
  "dep:url",
]
# PMIR, the patient master identity registry (ITI-93, ITI-94, #48).
pmir = []
# XCPD, cross-community patient discovery (ITI-55, #85).
xcpd = []

[dependencies]
fhir-types = { workspace = true, optional = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls"] }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
wiremock = { workspace = true }

[lints]
workspace = true
