# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# The only advisory gate: it reads the RustSec database cargo audit does and
# adds yanked, licences, bans and sources.

[advisories]
version = 2
yanked = "deny"
# An exception is dated and names the event that deletes it.
ignore = [
  # 2026-10-23 (#119): paste is unmaintained, a compile-time proc-macro under
  # the Leptos 0.8 family of the operator console with no runtime surface.
  # Deleted when no Leptos crate in the lock depends on paste. Its OpenVEX
  # statement is security/vex/rust-advisories.toml.
  # https://rustsec.org/advisories/RUSTSEC-2024-0436
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; a compile-time proc-macro under the Leptos 0.8 family of the operator console, with no runtime surface" },
]

[licenses]
version = 2
# Dev-dependencies are compiled here and in CI, so their licences are read too.
include-dev = true
# Permissive licences a BUSL-1.1 project can depend on and its Apache 2.0
# Change License admits, the set FerroAUTH carries. A licence joins the day a
# dependency needs it.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "ISC",
  "OpenSSL",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # The Mozilla root store webpki-roots carries for reqwest's rustls engine.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The project's own crates and the family's BUSL-1.1 crates (LICENSE): each
# joins the day it is a member or a dependency (`ihe-iti` and
# `nl-generic-functions` with the move, `ferrohealth-smart`, `ihe-atna`).
# The family's own crates are under the Business Source License 1.1, which
# no permissive allow-list names, so each is admitted by name: this
# repository's published crates, and the FerroHEALTH crates they depend on.
exceptions = [
  { allow = ["BUSL-1.1"], crate = "ihe-iti" },
  { allow = ["BUSL-1.1"], crate = "ihe-atna" },
  { allow = ["BUSL-1.1"], crate = "nl-generic-functions" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-smart" },
  # FerroBRIDGE's HL7 v2 face and what it brings: its v2-to-FHIR mapper
  # depends on the FHIRconnect engine, the terminology client and the
  # openEHR model crates, which the server links but never calls.
  { allow = ["BUSL-1.1"], crate = "ferrobridge-hl7v2" },
  { allow = ["BUSL-1.1"], crate = "ferrobridge-term" },
  { allow = ["BUSL-1.1"], crate = "fhirconnect" },
  { allow = ["BUSL-1.1"], crate = "openehr-mapping-core" },
  { allow = ["BUSL-1.1"], crate = "openehr-sdt" },
  # openehr-term's Rust code is Apache-2.0; the CC-BY-SA-3.0 half covers the
  # official openEHR terminology XML it redistributes verbatim, unchanged
  # and with attribution, and no first-party file derives from it.
  { allow = ["Apache-2.0", "CC-BY-SA-3.0"], crate = "openehr-term" },
  # The FerroUI components the operator console draws with, and the console
  # itself, which is never published.
  { allow = ["BUSL-1.1"], crate = "ferrohealth-ui" },
  { allow = ["BUSL-1.1"], crate = "ferropix-console" },
  # The server and its wire types, which are never published.
  { allow = ["BUSL-1.1"], crate = "ferropix-server" },
  { allow = ["BUSL-1.1"], crate = "ferropix-operator-api" },
  # The test support, a path-only dev-dependency, never published.
  { allow = ["BUSL-1.1"], crate = "ferropix-testkit" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
