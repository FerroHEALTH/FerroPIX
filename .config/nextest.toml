# The nextest configuration (https://nexte.st/docs/configuration/). A test
# that runs past its slow-timeout period is reported as slow, and one that
# runs past terminate-after periods is killed and fails the run by name, so
# a hang never stalls a run (https://nexte.st/docs/features/slow-tests/).
# No specification governs the limits: our own design, carried over from
# FerroFED with the crates.

[profile.default]
# The slowest offline test waits on a 10-second timeout of its own.
slow-timeout = { period = "30s", terminate-after = 2 }

# The tests that run a child cargo: the ihe-iti feature tests, a cargo tree
# per feature, and the console's dependency boundary, a cargo metadata. Each
# child takes the package cache lock, so beside a full parallel run on a
# laptop it waits on that lock and the CPU (#416): they share one group that
# runs two at a time, and each gets three minutes.
[test-groups]
cargo = { max-threads = 2 }

[[profile.default.overrides]]
filter = '(package(ihe-iti) & test(/^features::/)) | (package(ferropix-console) & test(/^boundary::/))'
slow-timeout = { period = "30s", terminate-after = 6 }
test-group = "cargo"

# The console's browser journeys walk every screen in a real browser, the
# battery in two themes, so each gets ten minutes; each starts a Chrome of
# its own, so no more than four run at once.
[[profile.default.overrides]]
filter = 'package(ferropix-testkit) & test(/^journeys::/)'
slow-timeout = { period = "60s", terminate-after = 10 }
threads-required = 2

# The blocking case loads 100000 records into its own PostgreSQL: about 17
# seconds alone, near a minute on a CI runner beside the other container
# cases, so it gets three minutes and a second thread (#172).
[[profile.default.overrides]]
filter = 'package(ferropix-server) & test(=e2e::blocking::a_feed_scores_only_the_pairs_its_blocking_keys_produce_among_100000_records)'
slow-timeout = { period = "30s", terminate-after = 6 }
threads-required = 2

# The PDQm search case loads 100000 records into its own PostgreSQL and
# times the first page of three searches, each held to the request timeout:
# about ten seconds alone, so it gets three minutes and a second thread like
# the blocking case (#72).
[[profile.default.overrides]]
filter = 'package(ferropix-server) & test(=e2e::pdqm_search::the_first_page_of_a_search_over_100000_records_answers_within_the_request_timeout)'
slow-timeout = { period = "30s", terminate-after = 6 }
threads-required = 2
