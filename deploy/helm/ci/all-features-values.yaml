# Every switch on: the MLLP listener, the console, a state claim and an
# ingress allowlist.
database:
  existingSecret: ferropix-db
dataKey:
  existingSecret: ferropix-data-key
usageReport:
  enabled: false
state:
  existingClaim: ferropix-state
config:
  auth:
    issuer:
      - issuer: "https://idp.example.org"
        kind: persons
        audience: ["https://pix.example.org/fhir", "ferropix-console"]
        first_party_clients: ["ferropix-console"]
      - issuer: "https://machines.example.org"
        kind: machines
        audience: ["https://pix.example.org/fhir"]
  trust:
    issuer:
      - issuer: "https://machines.example.org"
        clients: ["east-adt"]
  domain:
    - system: "urn:oid:2.999.1.1"
      name: "Chart check hospital"
      kind: local
      source_client_id: east-adt
  hl7v2:
    enabled: true
    listen: "0.0.0.0:2575"
    senders:
      - application: ADT
        facility: EAST
        domain: "urn:oid:2.999.1.1"
  terminology:
    endpoint:
      url: "https://tx.example.org/fhir/r4"
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress
console:
  enabled: true
  clientSecret:
    existingSecret: ferropix-console-oidc
