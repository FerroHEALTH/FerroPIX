# The manual crates.io lane: a dry run by default, and the recovery path when
# a release's crates leg fails ("already exists" counts as done). Trusted
# Publishing (OIDC) through rust-lang/crates-io-auth-action; each crate carries
# one publisher entry naming this file and one naming release.yml, both under
# the `crates-io` environment (.claude/rules/crates-publishing.md).
name: Publish crates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish to crates.io (false = dry run)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  dry-run:
    name: dry run
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Every published crate packages
        run: |
          set -euo pipefail
          crates="$(bash scripts/release/publish-crates.sh list)"
          if [ -z "$crates" ]; then
            echo "no published crate yet; nothing to package"
            exit 0
          fi
          while IFS= read -r crate; do
            cargo publish -p "$crate" --dry-run --locked
          done <<< "$crates"

  publish:
    name: publish
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh publish
      - name: Verify every crate resolves at its manifest version
        if: always()
        run: bash scripts/release/publish-crates.sh verify
