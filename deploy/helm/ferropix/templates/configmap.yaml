{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret must name the Secret that holds the PostgreSQL URL" }}
{{- end }}
{{- if not .Values.dataKey.existingSecret }}
{{- fail "dataKey.existingSecret must name the Secret that holds the sealing key" }}
{{- end }}
{{- if not (or (dig "auth" "issuer" list .Values.config) (dig "auth" "basic" dict .Values.config)) }}
{{- fail "config.auth.issuer must name at least one [[auth.issuer]] entry, each with its issuer, kind and audience" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ferropix.fullname" . }}
  labels:
    {{- include "ferropix.labels" . | nindent 4 }}
data:
  ferropix.toml: |
    {{- include "ferropix.config" . | nindent 4 }}
