# The reusable crate lane release.yml calls: package each published crate
# with no build cache, attest the .crate files through Sigstore, and attach
# each file, its checksum and its attestation bundle to the draft release. A
# reusable workflow keeps the signing identity out of reach of
# caller-defined steps (SLSA v1.0 Build Level 3; GitHub, "Using artifact
# attestations and reusable workflows to achieve SLSA v1 Build Level 3").
name: Release crate

on:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag being released.
        required: true
        type: string
      version:
        description: The version the tag names.
        required: true
        type: string
      crates:
        description: The published crates, space-separated, in dependency order.
        required: true
        type: string

permissions: {}

jobs:
  crate:
    name: package and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # attach the assets to the draft release
      id-token: write # Sigstore
      attestations: write # store the attestation against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Package the crates
        env:
          VERSION: ${{ inputs.version }}
          CRATES: ${{ inputs.crates }}
        run: |
          set -euo pipefail
          mkdir dist
          for crate in $CRATES; do
            cargo package -p "$crate" --locked
            file="target/package/${crate}-${VERSION}.crate"
            test -s "$file"
            cp "$file" dist/
            (cd dist && sha256sum "${crate}-${VERSION}.crate" > "${crate}-${VERSION}.crate.sha256sum")
          done
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.crate
      - name: Attach each crate, its checksum and the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          CRATES: ${{ inputs.crates }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for crate in $CRATES; do
            cp "$BUNDLE" "dist/${crate}-${VERSION}.crate.sigstore.json"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "dist/${crate}-${VERSION}.crate" \
              "dist/${crate}-${VERSION}.crate.sha256sum" \
              "dist/${crate}-${VERSION}.crate.sigstore.json"
          done
