# The release lane, dormant until a `v*` tag is pushed. Every ordering in it
# is a `needs` edge:
#
#   plan ── github-release (draft) ─┬─ build-binaries ── build-image ─┬─ vulnerability-record ─┬─ finalize-release ── crates ── milestone
#                                   ├─ build-console ──────────────────┤                        └─ scan-and-tag ──────────────────┘
#                                   └─ crate (reusable) ───────────────┘
#
# plan runs every release fact of scripts/release/plan.sh at the tagged
# commit: it refuses a tag whose milestone (titled exactly as the tag) is
# missing or still holds an open item, and a section whose Security entries
# name no advisory. milestone closes the milestone once every leg succeeded
# (scripts/release/milestone.sh).
#
# The release is created as a DRAFT, the server and console binaries with
# their SBOMs and Sigstore bundles, the console's site bundle and the attested
# .crate files are attached to it, and it is
# published only once the asset set is complete. Publishing last means a
# half-assembled release is never visible, and a published release is
# immutable, so the draft is the only window the uploads have.
#
# build-binaries, build-image, build-console and crate are `uses:` calls AND
# NOTHING ELSE.
# SLSA v1.2 Build Level 3 requires the signing material to be out of reach of
# the user-defined build steps, and every step of one job shares one runner
# VM; a reusable workflow's job cannot carry `steps:` from its caller, which
# makes the regression unrepresentable
# (https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
#
# The images are pushed by digest with no tag. vulnerability-record scans
# them and the server tarballs with no severity floor and refuses the release
# while a finding lacks an OpenVEX judgement under security/vex/;
# finalize-release and scan-and-tag both wait on it, so a refused release is
# neither published nor tagged. scan-and-tag runs the HIGH/CRITICAL gate on
# each digest and only then applies the tags.
#
# The crates leg uploads the crates scripts/release/publish-crates.sh lists
# through Trusted Publishing behind the `crates-io` environment's required
# reviewer; while it lists none, the crate and crates legs are skipped.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish. Dispatch this workflow AT that tag."
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a draft with
# some assets attached is worse than a queued second run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No permissions by default: each job grants its own, and the build jobs grant
# theirs to the reusable workflow they call.
permissions: {}

jobs:
  # ---- plan: every release fact, verified before anything is created --------
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read # the milestone titled as the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is-prerelease: ${{ steps.tag.outputs.is_prerelease }}
      targets: ${{ steps.targets.outputs.targets }}
      console-targets: ${{ steps.targets.outputs.console_targets }}
      crates: ${{ steps.crates.outputs.crates }}
      crate-files: ${{ steps.crates.outputs.files }}
    steps:
      - id: tag
        name: Resolve and validate the release tag
        # The dispatch input reaches the shell through env, never spliced into
        # the script, and has to match a full semver tag shape before anything
        # downstream uses it.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # A dispatch runs at whatever ref it was started from, so the two
            # are compared: binaries are never built from another commit.
            if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
              echo "::error::dispatched at '${GITHUB_REF}', not at refs/tags/${tag}. Run: gh workflow run Release --ref ${tag} -f tag=${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          case "$tag" in
            *-*) is_prerelease=true ;;
            *) is_prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - id: crates
        name: The published crates of this release
        run: |
          set -euo pipefail
          crates="$(bash scripts/release/publish-crates.sh list | tr '\n' ' ' | sed 's/ *$//')"
          # Each crate is on its own version line, apart from the tag
          # (.claude/rules/crates-publishing.md), so its files carry its own.
          files=""
          for crate in $crates; do
            files="$files ${crate}-$(bash scripts/release/publish-crates.sh version "$crate")"
          done
          files="${files# }"
          echo "published crates: ${crates:-none} (${files:-no files})"
          {
            echo "crates=$crates"
            echo "files=$files"
          } >> "$GITHUB_OUTPUT"

      # The server binary targets, emitted once here and read both by the
      # build-binaries matrix and by the finalize asset check, so the two
      # cannot drift apart. The static musl targets alone, because the image
      # is distroless static, and one native runner per architecture, so there
      # is no cross-compilation and no emulation anywhere in this lane. No
      # specification governs this: our own design.
      - id: targets
        name: Name the binary targets
        run: |
          set -euo pipefail
          targets='{"include":[
            {"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}
          ]}'
          echo "targets=$(printf '%s' "$targets" | tr -d '\n ')" >> "$GITHUB_OUTPUT"
          # The operator console's binary, on the same two static targets,
          # each named by the image platform it fills.
          console_targets='{"include":[
            {"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","arch":"amd64"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","arch":"arm64"}
          ]}'
          echo "console_targets=$(printf '%s' "$console_targets" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

      # Every release fact, as ONE list: the milestone titled as the tag, the
      # workspace version, the changelog's structure and Security rules for
      # this section, and the release notes with the support period. The list
      # is scripts/release/plan.sh; scripts/release/preflight.sh runs the same
      # list before the tag is pushed, so the two cannot drift (no
      # specification governs the list: our own design). It names every
      # refused check, and writes release-notes.md for github-release. A
      # missing or empty changelog section fails the release rather than
      # falling back to notes generated from the commit range.
      - name: Every release fact holds at the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release/plan.sh checks "$TAG" --notes release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # ---- github-release: create the release as a DRAFT ------------------------
  github-release:
    name: github release (draft)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          IS_PRERELEASE: ${{ needs.plan.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$VERSION" --notes-file release-notes.md)
          if [ "$IS_PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$state" in
            missing) gh release create "$TAG" "${args[@]}" ;;
            true) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file release-notes.md ;;
            *)
              echo "::error::$TAG is already published. A bad cut ships forward as a new patch version; it is never retagged." >&2
              exit 1
              ;;
          esac

  # ---- build-binaries: the SLSA Build L3 lane, once per target --------------
  # A call and nothing else: the isolation is what makes the provenance
  # unforgeable, and a job that carries `uses:` cannot also carry `steps:`.
  build-binaries:
    name: binaries (${{ matrix.target }})
    needs: [plan, github-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    # Declared on both sides: a called workflow receives the caller's token
    # permissions, and GitHub's Build L3 guide asks for the same set in both
    # places.
    permissions:
      contents: write # attach the per-target assets to the draft release
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  # ---- build-image: the container from the attested musl binaries -----------
  # A call and nothing else, for the same Build L3 reason.
  build-image:
    name: image (linux/amd64, linux/arm64)
    needs: [plan, build-binaries]
    permissions:
      contents: read # the attestations API, to verify the inputs
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}

  # ---- build-console: the operator console's binaries, bundle and image ------
  # A call and nothing else, for the same Build L3 reason. It attaches the
  # console's assets to the draft, so it waits for the draft to exist.
  build-console:
    name: console (binaries, site bundle, image)
    needs: [plan, github-release]
    permissions:
      contents: write # attach the console's assets to the draft release
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-console.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      targets: ${{ needs.plan.outputs.console-targets }}

  # ---- crate: package and attest each published crate -----------------------
  # A call and nothing else, for the same Build L3 reason.
  crate:
    name: crate (package and attest)
    needs: [plan, github-release]
    if: needs.plan.outputs.crates != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-crate.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      crates: ${{ needs.plan.outputs.crates }}

  # ---- vulnerability-record: every finding, judged, or no release -----------
  # CRA Annex I Part I(2)(a) (Regulation (EU) 2024/2847): products are made
  # available without known exploitable vulnerabilities. The scan-and-tag gate
  # blocks HIGH and CRITICAL findings that have a fix; this job scans the same
  # pushed digest and the server tarballs with NO severity floor and NO
  # `ignore-unfixed`, and scripts/checks/vex-coverage.sh refuses the release
  # while any finding lacks an OpenVEX statement that judges it. It runs before
  # finalize-release and scan-and-tag, so a refused release stays a draft and
  # its image stays untagged.
  vulnerability-record:
    name: vulnerability record
    needs: [plan, github-release, build-binaries, build-image, build-console]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # read the draft's tarballs, attach the record to it
      packages: read # pull the digest the image job pushed
    env:
      # The one Trivy version of the release and the weekly scan, pinned in
      # docs/VERSIONS.md and read back by scripts/checks/versions.sh.
      TRIVY_VERSION: "0.76.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: The coverage check refuses what it claims to refuse
        run: bash scripts/checks/vex-coverage.sh --self-test
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan every image and tarball, every severity, fixed or not
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          SERVER_DIGEST: ${{ needs.build-image.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.build-console.outputs.digest }}
        run: |
          set -euo pipefail
          # An explicit empty config and ignore file: trivy reads ./trivy.yaml
          # and its ignore file by default, which would put the gate's floor
          # and its exceptions back into the record.
          : > "$RUNNER_TEMP/empty.yaml"
          : > "$RUNNER_TEMP/empty.ignore"
          scan=(--config "$RUNNER_TEMP/empty.yaml" --ignorefile "$RUNNER_TEMP/empty.ignore"
            --scanners vuln --severity "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
            --ignore-unfixed=false --format json --quiet)
          mkdir -p reports binaries
          targets=()
          entries=("ferropix|$SERVER_DIGEST" "ferropix-console|$CONSOLE_DIGEST")
          for entry in "${entries[@]}"; do
            image="${entry%%|*}"
            digest="${entry#*|}"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::no pushed digest for ${image}" >&2; exit 1 ;;
            esac
            for platform in linux/amd64 linux/arm64; do
              report="reports/${image}-${platform##*/}.json"
              trivy image "${scan[@]}" --platform "$platform" --output "$report" \
                "ghcr.io/ferrohealth/${image}@${digest}"
              targets+=("pkg:oci/${image}=${report}")
            done
          done
          while IFS= read -r target; do
            tarball="ferropix-${TAG}-${target}.tar.gz"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$tarball" --dir binaries
            mkdir -p "binaries/${target}"
            tar -C "binaries/${target}" -xzf "binaries/${tarball}"
            report="reports/ferropix-${target}.json"
            trivy rootfs "${scan[@]}" --output "$report" "binaries/${target}"
            targets+=("pkg:cargo/ferropix-server=${report}")
          done < <(printf '%s' "$TARGETS" | jq -r '.include[].target')
          printf '%s\n' "${targets[@]}" > targets.txt
      - name: Every finding carries an exploitability judgement
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t targets < targets.txt
          bash scripts/checks/vex-coverage.sh \
            --record "ferropix-${TAG}-vulnerability-record.json" "${targets[@]}"
          tar -czf "ferropix-${TAG}-trivy-reports.tar.gz" reports
      # Kept for a refused run too, so the findings to judge are one download
      # away rather than one re-run away.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-record
          path: |
            reports/
            ferropix-*-vulnerability-record.json
          if-no-files-found: warn
          retention-days: 30
      - name: Attach the record to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "ferropix-${TAG}-vulnerability-record.json" \
            "ferropix-${TAG}-trivy-reports.tar.gz"

  # ---- scan-and-tag: the gate that makes the pushed digest referencable -----
  # A call and nothing else. vulnerability-record first: a release it refuses
  # gets no image tags.
  scan-and-tag:
    name: scan + tag
    needs: [build-image, build-console, vulnerability-record]
    permissions:
      contents: read # check out trivy.yaml, verify the attestations
      packages: write # pull the pushed digests, then tag them
    uses: ./.github/workflows/scan-and-tag.yml
    with:
      server-digest: ${{ needs.build-image.outputs.digest }}
      server-tags: ${{ needs.build-image.outputs.tags }}
      console-digest: ${{ needs.build-console.outputs.digest }}
      console-tags: ${{ needs.build-console.outputs.tags }}

  # ---- finalize-release: verify the asset set, then PUBLISH -----------------
  finalize-release:
    name: github release (publish)
    needs: [plan, github-release, build-binaries, build-image, build-console, crate, vulnerability-record]
    # The crate leg is skipped when the release publishes no crate.
    if: always() && needs.vulnerability-record.result == 'success' && (needs.crate.result == 'success' || (needs.crate.result == 'skipped' && needs.plan.outputs.crates == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publish the release
    steps:
      - name: The draft carries every asset this version promises
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          CONSOLE_TARGETS: ${{ needs.plan.outputs.console-targets }}
          CRATE_FILES: ${{ needs.plan.outputs.crate-files }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "attached assets:"
          printf '%s\n' "$assets"
          missing=""
          # Every suffix release-build.yml uploads, per target. `grep -Fxq` is
          # a fixed string matched whole-line, so ".tar.gz" is not satisfied by
          # ".tar.gz.sha256sum".
          while IFS= read -r target; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.build-sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".cdx.json" \
              ".spdx.json"; do
              printf '%s\n' "$assets" | grep -Fxq "ferropix-${TAG}-${target}${suffix}" \
                || missing="$missing ferropix-${TAG}-${target}${suffix}"
            done
          done < <(printf '%s' "$TARGETS" | jq -r '.include[].target')
          # Every suffix release-console.yml uploads: per console target, and
          # once for the architecture-independent site bundle.
          while IFS= read -r target; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".spdx.json"; do
              printf '%s\n' "$assets" | grep -Fxq "ferropix-console-${TAG}-${target}${suffix}" \
                || missing="$missing ferropix-console-${TAG}-${target}${suffix}"
            done
          done < <(printf '%s' "$CONSOLE_TARGETS" | jq -r '.include[].target')
          for suffix in ".tar.gz" ".tar.gz.sha256sum" ".tar.gz.sigstore.json" ".tar.gz.intoto.jsonl"; do
            printf '%s\n' "$assets" | grep -Fxq "ferropix-console-${TAG}-site${suffix}" \
              || missing="$missing ferropix-console-${TAG}-site${suffix}"
          done
          for file in $CRATE_FILES; do
            for suffix in ".crate" ".crate.sha256sum" ".crate.sigstore.json"; do
              printf '%s\n' "$assets" | grep -Fxq "${file}${suffix}" \
                || missing="$missing ${file}${suffix}"
            done
          done
          for record in "ferropix-${TAG}-vulnerability-record.json" "ferropix-${TAG}-trivy-reports.tar.gz"; do
            printf '%s\n' "$assets" | grep -Fxq "$record" || missing="$missing $record"
          done
          if [ -n "$missing" ]; then
            echo "::error::the draft is missing assets, so it will not be published:$missing" >&2
            exit 1
          fi
          echo "every expected asset is attached."
      # `--latest` marks this release as the repository's latest, which a
      # pre-release must never be.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          IS_PRERELEASE: ${{ needs.plan.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  # ---- crates.io: the published crates, after the release is public ---------
  # Trusted Publishing; the `crates-io` environment's required reviewer pauses
  # the leg until the owner approves. scripts/release/publish-crates.sh is
  # shared with publish-crates.yml.
  crates:
    name: crates.io
    needs: [plan, finalize-release]
    if: needs.plan.outputs.crates != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh publish
      - name: Verify every crate resolves at its manifest version
        if: always()
        run: bash scripts/release/publish-crates.sh verify

  # ---- milestone: close the release's milestone ------------------------------
  # After every leg, the approval-gated crates leg included. `always()` keeps
  # the job in the graph when a leg fails, so its log names that leg and the
  # milestone stays open; a re-run of the failed jobs closes it. An
  # already-closed milestone counts as done.
  milestone:
    name: close the milestone
    needs: [plan, github-release, build-binaries, build-image, build-console, crate, vulnerability-record, scan-and-tag, finalize-release, crates]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the script
      issues: write # close the milestone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Close the milestone titled as the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPABLE_LEGS: ${{ needs.plan.outputs.crates == '' && 'crate crates' || '' }}
        run: bash scripts/release/milestone.sh close "$TAG"
