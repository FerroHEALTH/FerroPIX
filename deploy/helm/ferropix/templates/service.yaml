apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferropix.fullname" . }}
  labels:
    {{- include "ferropix.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ferropix.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.config.hl7v2.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferropix.fullname" . }}-mllp
  labels:
    {{- include "ferropix.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ferropix.selector" . | nindent 4 }}
  ports:
    - name: mllp
      port: {{ .Values.service.mllpPort }}
      targetPort: mllp
{{- end }}
