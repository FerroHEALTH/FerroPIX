# The self-test of the performance gate: scripts/perf/gate.sh plants an
# outbox poller that never waits beside the server (the FerroPIX #490 shape)
# and runs this plan, which must fail on idle transactions. Its [idle] table
# is the gate's own, word for word (gate.sh --self-test holds the two
# equal); the load is a token one, since only the idle phase is judged. No
# specification governs this: our own design.

[idle]
duration_secs = 60
max_cpu_percent = 2.0
max_transactions_per_second = 1.0

[load]
rate = 5.0
warmup_secs = 1
duration_secs = 4

[[requests]]
group = "metadata"
method = "GET"
path = "/fhir/metadata"
status = 200
