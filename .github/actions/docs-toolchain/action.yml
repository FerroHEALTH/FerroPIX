name: Install the docs toolchain
description: >-
  Install the documentation toolchain the "Documentation toolchain" table of
  docs/VERSIONS.md pins (mdBook, mdbook-lint, lychee), read through
  scripts/site/toolchain.sh. The calling job checks out the repository first:
  a local action path resolves only after checkout, so this action does not
  check out.
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      run: echo "tools=$(scripts/site/toolchain.sh)" >> "$GITHUB_OUTPUT"
    # install-action downloads each tool's upstream release binary and
    # verifies its checksum, so no cargo build runs in the docs lane.
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: ${{ steps.pins.outputs.tools }}
