# The Helm chart, packaged and published as an OCI artifact, as a REUSABLE
# workflow: the SLSA Build Level 3 lane of the chart, beside release-image.yml
# and release-console.yml. A caller passes data only and cannot add steps
# beside the packaging and the attestation
# (https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
#
# Two callers:
#   - release.yml, after scan-and-tag, passes the released tag and the
#     digests of the two images it published: the packaged chart carries the
#     release as its appVersion and deploys those images by digest, and it
#     asks to publish.
#   - publish-chart.yml, a manual dispatch for a chart-only fix between
#     releases, a dry run unless asked to publish, or, given a release tag,
#     the recovery of that release's chart leg from the tag's tree.
#
# A version already in the registry is published again never. When the
# chart this run packages unpacks to the same files as the published one
# (scripts/release/chart-published.sh), the push is skipped and the
# published digest is attested, so a leg that pushed and then failed its
# attestation is finished by a re-run with the same signing workflow; when
# the files differ, a publish is refused.
#
# `helm push` appends the chart name, so the chart lands at
# oci://ghcr.io/ferrohealth/charts/ferropix. A consumer verifies it with:
#
#   gh attestation verify oci://ghcr.io/ferrohealth/charts/ferropix:<version> \
#     --repo FerroHEALTH/FerroPIX \
#     --signer-workflow FerroHEALTH/FerroPIX/.github/workflows/build-chart.yml
name: Build chart (reusable)

on:
  workflow_call:
    inputs:
      publish:
        description: Push and attest the package (false packages only).
        required: false
        type: boolean
        default: false
      release-tag:
        description: >-
          The vX.Y.Z tag being released or recovered, whose tree the chart
          is packaged from; empty for a dispatch between releases, which
          packages the committed appVersion.
        required: false
        type: string
        default: ""
      server-digest:
        description: The digest of the released server image index, pinned in the package.
        required: false
        type: string
        default: ""
      console-digest:
        description: The digest of the released console image index, pinned in the package.
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: The digest of the pushed or already published chart, empty for a dry run.
        value: ${{ jobs.chart.outputs.digest }}

permissions: {}

env:
  # A release tag packages the chart of the tag's tree, checked out beside
  # the workflow's own revision, whose scripts compare the packages.
  CHART_TREE: ${{ inputs.release-tag != '' && 'tagged' || '.' }}
  CHART_DIR: ${{ inputs.release-tag != '' && 'tagged/deploy/helm/ferropix' || 'deploy/helm/ferropix' }}
  OCI_NAMESPACE: oci://ghcr.io/ferrohealth/charts
  CHART_REF: ghcr.io/ferrohealth/charts/ferropix

jobs:
  chart:
    name: package + publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the chart to GHCR
      id-token: write # Sigstore, for the keyless attestation
      attestations: write # store it against this repository
    outputs:
      digest: ${{ steps.push.outputs.digest || steps.published.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the released tree
        if: inputs.release-tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release-tag }}
          path: tagged

      # The helm and kubeconform ci.yml's helm-chart job validates the chart
      # with, checked against their published SHA-256.
      - name: Install helm and kubeconform
        env:
          HELM_VERSION: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          helm version --short
          kubeconform -v

      # A release pins the two images it published by digest in the packaged
      # values, so an install deploys exactly the scanned images
      # (https://helm.sh/docs/topics/charts/#the-chartyaml-file, appVersion).
      - name: Pin the released images
        if: inputs.release-tag != ''
        env:
          TAG: ${{ inputs.release-tag }}
          SERVER_DIGEST: ${{ inputs.server-digest }}
          CONSOLE_DIGEST: ${{ inputs.console-digest }}
        run: |
          set -euo pipefail
          for digest in "$SERVER_DIGEST" "$CONSOLE_DIGEST"; do
            if ! printf '%s\n' "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              echo "::error::a release chart needs both image digests, got '${digest}'" >&2
              exit 1
            fi
          done
          if ! printf '%s\n' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${TAG}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          version="${TAG#v}"
          yq -i ".appVersion = \"${version}\"" "$CHART_DIR/Chart.yaml"
          yq -i ".image.digest = \"${SERVER_DIGEST}\" | .console.image.digest = \"${CONSOLE_DIGEST}\"" \
            "$CHART_DIR/values.yaml"
          git -C "$CHART_TREE" diff -- deploy/helm/ferropix

      - name: Lint and package
        id: package
        run: |
          set -euo pipefail
          helm lint "$CHART_DIR"
          bash "$CHART_TREE/deploy/helm/validate.sh"
          helm package "$CHART_DIR" --destination dist
          version="$(yq '.version' "$CHART_DIR/Chart.yaml")"
          echo "path=dist/ferropix-${version}.tgz" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A published chart version is immutable: a version already in the
      # registry is compared by its unpacked files with this package. The same
      # files skip the push and attest the published digest; other files fail
      # a publish and are reported on a dry run. Only a registry answer of
      # "not found" counts as unpublished; any other failure stops the leg.
      - name: Compare with a version already published
        id: published
        env:
          VERSION: ${{ steps.package.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
          PUBLISH: ${{ inputs.publish }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          mkdir -p published
          if ! helm pull "oci://${CHART_REF}" --version "$VERSION" --destination published > pull.log 2>&1; then
            cat pull.log
            if grep -qE ': (not found|name unknown)' pull.log; then
              echo "${CHART_REF}:${VERSION} is not published yet."
              exit 0
            fi
            echo "::error::the registry did not answer whether ${CHART_REF}:${VERSION} is published" >&2
            exit 1
          fi
          cat pull.log
          digest="$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64})$/\1/p' pull.log)"
          if [ -z "$digest" ]; then
            echo "::error::helm pull printed no digest" >&2
            exit 1
          fi
          if bash scripts/release/chart-published.sh compare "published/ferropix-${VERSION}.tgz" "$PACKAGE"; then
            echo "::notice::${CHART_REF}:${VERSION} is published already with the same files; the push is skipped and ${digest} is attested"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUBLISH" = "true" ]; then
            echo "::error::${CHART_REF}:${VERSION} is published already with other files; raise the chart version in Chart.yaml" >&2
            exit 1
          fi
          echo "::warning::${CHART_REF}:${VERSION} is published already with other files; a publish would be refused"

      - name: Push the chart
        id: push
        if: inputs.publish && steps.published.outputs.digest == ''
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          helm push "$PACKAGE" "$OCI_NAMESPACE" 2>&1 | tee push.log
          digest="$(sed -nE 's/^Digest: (sha256:[0-9a-f]+)$/\1/p' push.log)"
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The attestation is pushed beside the chart through the Docker
      # credential store, which helm registry login does not fill.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish && (steps.push.outputs.digest != '' || steps.published.outputs.digest != '')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the chart's provenance
        if: inputs.publish && (steps.push.outputs.digest != '' || steps.published.outputs.digest != '')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REF }}
          subject-digest: ${{ steps.push.outputs.digest || steps.published.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
