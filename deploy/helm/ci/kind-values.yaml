# The cluster check: the server against the PostgreSQL of ci/kind/, with
# the compose quickstart's development issuer as a sidecar, so the server
# reads its metadata on loopback (RFC 8414 §2 admits plain http there), and
# the console beside it. A development issuer signs any request: never for
# anything real.
database:
  existingSecret: ferropix-db
dataKey:
  existingSecret: ferropix-data-key
usageReport:
  enabled: false
# A kind node is itself a container, and runc cannot mount sysfs inside a
# pod's own user namespace there, so the sandbox never starts; the check
# shares the node's user namespace.
hostUsers: true
config:
  profile: production
  public_base_url: "http://localhost:8080"
  server:
    listen: "0.0.0.0:8080"
  auth:
    issuer:
      dev:
        issuer: "http://localhost:8180/ferropix"
        audience: ["http://localhost:8080/fhir", "ferropix-console"]
  trust:
    issuer:
      - issuer: dev
        clients: ["quickstart-source"]
  domain:
    - system: "urn:oid:2.999.1.1"
      name: "Chart check hospital"
      kind: local
      identifier_type: PI
      source_client_id: quickstart-source
  hl7v2:
    enabled: true
    listen: "0.0.0.0:2575"
    senders:
      - application: ADT
        facility: EAST
        domain: "urn:oid:2.999.1.1"
  terminology:
    endpoint:
      url: "https://tx.example.org/fhir/r4"
extraContainers:
  - name: issuer
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5@sha256:d88e445d55c4ff6eed59b02d86adfece47d985233b1616fb712669b98328c8a2
    env:
      - name: SERVER_PORT
        value: "8180"
      # The token callbacks of the compose quickstart's issuer service, each
      # signing an RFC 9068 `at+jwt` access token.
      - name: JSON_CONFIG
        value: >-
          {"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"ferropix",
          "requestMappings":[{"requestParam":"grant_type","match":"client_credentials",
          "typeHeader":"at+jwt","claims":{"sub":"${clientId}","client_id":"${clientId}",
          "aud":["http://localhost:8080/fhir"],"scope":"${scope}"}},
          {"requestParam":"grant_type","match":"authorization_code|refresh_token",
          "typeHeader":"at+jwt","claims":{"client_id":"${clientId}","aud":["${clientId}"],
          "scope":"openid __ferropix.steward"}}]}]}
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities:
        drop: ["ALL"]
console:
  enabled: true
  config:
    oidc:
      issuer: "http://localhost:8180/ferropix"
      authorization_endpoint: "http://localhost:8180/ferropix/authorize"
      token_endpoint: "http://localhost:8180/ferropix/token"
      jwks_uri: "http://localhost:8180/ferropix/jwks"
      client_id: ferropix-console
      redirect_uri: "http://localhost:3000/auth/callback"
    session:
      secure_cookie: false
  clientSecret:
    existingSecret: ferropix-console-oidc
