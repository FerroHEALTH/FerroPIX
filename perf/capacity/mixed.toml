group = "pixm-query"
method = "GET"
path = "/fhir/Patient/$ihe-pix?sourceIdentifier=urn%3Aoid%3A2.999.1.1%7CC-0500000&targetSystem=urn%3Aoid%3A2.999.1.1"
status = 200
headers = { authorization = "Bearer {consumer_token}" }
