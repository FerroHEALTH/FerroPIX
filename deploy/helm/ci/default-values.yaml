# The chart with its required inputs, the Secrets and one issuer, and
# nothing else set.
database:
  existingSecret: ferropix-db
dataKey:
  existingSecret: ferropix-data-key
usageReport:
  enabled: false
config:
  auth:
    issuer:
      - issuer: "https://idp.example.org"
        kind: machines
        audience: ["https://pix.example.org/fhir"]
