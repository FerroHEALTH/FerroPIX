{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ferropix.fullname" . }}
  labels:
    {{- include "ferropix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ferropix.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
        {{- if .Values.config.hl7v2.enabled }}
        - port: mllp
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.console.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ferropix.console" . }}
  labels:
    {{- include "ferropix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ferropix.consoleSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
