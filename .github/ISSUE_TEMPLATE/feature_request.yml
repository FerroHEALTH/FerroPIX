name: Feature request
description: Propose a capability or an improvement.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The product, the integration or the deployment that needs it, and why.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What FerroPIX does, and which part (the cross-reference, a PIX or PDQ transaction, the pseudonymous identifiers, the configuration) it changes.
    validations:
      required: true
  - type: textarea
    id: standard
    attributes:
      label: Specification reference
      description: The IHE profile, transaction and section (ITI TF, PIXm, PDQm), the FHIR R4 page or the HL7 v2 segment this relates to, if any.
    validations:
      required: false
