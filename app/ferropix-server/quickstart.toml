# The quickstart configuration of the FerroPIX server: a production profile
# on the loopback base, with both secrets read from the files a container
# runtime mounts. `ferropix config check --config quickstart.toml` accepts it
# once the two files exist. Every key and its default is listed in the book,
# https://ferropix.eu/docs/operate/configuration.html.

profile = "production"
public_base_url = "http://localhost:8080"

[server]
listen = "0.0.0.0:8080"

[db]
url_file = "/run/secrets/ferropix-db-url"
# The sealing key: the base64 of 32 random bytes, `openssl rand -base64 32`.
data_key_file = "/run/secrets/ferropix-data-key"

# The development OpenID Provider the compose quickstart runs beside the
# server on the same loopback interface (compose.yaml, the `issuer` service).
# It signs the client credentials tokens of the Sources and the logins of the
# console, so it is a `persons` issuer: a token whose `sub` is its client is
# a machine's (RFC 9068 §2.2), and a login is admitted through the console,
# the one client `first_party_clients` lists. It signs its access tokens with
# `typ` JWT rather than the `at+jwt` of RFC 9068, and names the client in
# `client_id` or `azp`, so the issuer takes the claims it carries; an issuer
# of RFC 9068 tokens keeps the profile's own `token_types`,
# `required_claims` and `client_claims`. It signs a login's access token
# with the ID Token's claims, so the console's own client id is the second
# audience: a provider that audiences a login's access token to the server
# needs only the first.
[[auth.issuer]]
issuer = "http://localhost:8180/ferropix"
kind = "persons"
profile = "rfc9068"
audience = ["http://localhost:8080/fhir", "ferropix-console"]
token_types = ["JWT"]
required_claims = ["iss", "exp", "aud", "sub"]
client_claims = ["client_id", "azp"]
first_party_clients = ["ferropix-console"]

# The clients the development issuer may vouch for as the Source of a
# domain (PIXm 3.1.0 §2:3.104.5).
[[trust.issuer]]
issuer = "http://localhost:8180/ferropix"
clients = ["quickstart-source"]

# An identifier domain under the OID arc 2.999, which ITU-T X.660 reserves
# for examples, so the quickstart names no real assigning authority.
[[domain]]
system = "urn:oid:2.999.1.1"
name = "Quickstart hospital"
kind = "local"
source_client_id = "quickstart-source"

# The BSN, the national number of the Netherlands (NL Generic Functions,
# the Identification page): authoritative, so a BSN two records carry links
# them, and sealed at rest. Its values must pass the eleven-proof.
[[domain]]
system = "http://fhir.nl/fhir/NamingSystem/bsn"
name = "BSN"
kind = "authoritative"
source_client_id = "quickstart-source"
sensitive = true

# The pseudonymised BSN of the Generic Functions, held as an identifier of
# its own, fed by the system that obtained it. FerroPIX calls no BSNk
# service.
[[domain]]
system = "http://fhir.nl/fhir/NamingSystem/pseudo-bsn"
name = "Pseudonymised BSN"
kind = "authoritative"
source_client_id = "quickstart-source"
sensitive = true

# The steward's API, which the console reads and writes (compose.yaml, the
# `console` profile).
[operator]
enabled = true

[usage_report]
deployment = "compose"
state_dir = "/var/lib/ferropix"
