# The published crates under `crates/`, the applications under `app/` and
# the test-support tools under `tools/`, which are never published.
[workspace]
resolver = "3"
members = ["crates/*", "app/*", "tools/*"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
repository = "https://github.com/FerroHEALTH/FerroPIX"
homepage = "https://ferropix.eu/"
authors = ["Ruben Talstra"]

# The authoritative third-party set. A crate takes a dependency with
# dep.workspace = true, and every version is checked against crates.io on the
# day it is added (.claude/rules/reliability.md). The versions are the ones
# FerroFED pins, so a product that takes these crates resolves one copy of
# each.
[workspace.dependencies]
async-trait = "0.1.92"
# The operator console's HTTP service (app/ferropix-console): axum under
# leptos_axum, with tower's middleware and tower-http's headers and
# compression, at the versions FerroBRIDGE's and FerroUI's consoles resolve.
# Verified against crates.io on 2026-10-23.
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", default-features = false }
tracing = "0.1.44"
clap = { version = "4.6.7", features = ["derive"] }
cookie = { version = "0.18.2", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "display", "serde"] }
# The console's UI: Leptos 0.8 in islands mode, the FerroUI components pinned
# exactly and moved in lockstep with every console (.claude/rules/leptos-ui.md),
# and the console's own Fluent catalog. The browser half's glue is the
# wasm-bindgen the site build's CLI must equal. Verified against crates.io on
# 2026-10-23.
leptos = { version = "0.8.22", default-features = false }
leptos_axum = "0.8.10"
leptos_meta = { version = "0.8.7", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
ferrohealth-ui = "=0.3.7"
fluent-templates = { version = "0.15.1", default-features = false, features = ["macros", "walkdir"] }
wasm-bindgen = "0.2.129"
console_error_panic_hook = "0.1.7"
# The synthetic test keys of the Nuts tests, at the version FerroFED pins.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# The generated FHIR model of FerroBRIDGE, at the version FerroFED and
# ihe-atna pin.
fhir-types = { version = "0.1.128", default-features = false }
# The SMART and OAuth 2.0 crate of FerroHEALTH/FerroAUTH: the RFC 8414
# issuer rule and metadata location of the Nuts grant, without its HTTP
# fetchers; pinned exactly, as every family crate.
ferrohealth-smart = { version = "=0.6.0", default-features = false }
# FerroBRIDGE's HL7 v2 face (docs/architecture.md section 7): the MLLP
# Release 1 codec and listener, the MSH-18 decoder, the positional parser and
# the original-mode acknowledgment, over the generated v2 tables, pinned
# exactly as every family crate. Verified against crates.io on 2026-10-25.
ferrobridge-hl7v2 = "=0.1.141"
hl7v2-types = "=0.1.127"
http = "1.5.0"
# The audit trail of FerroHEALTH/FerroAUDIT (ITI-20 and BALP), whose `user`
# model the identity profiles share; pinned exactly, as every family crate.
ihe-atna = { version = "=0.2.7", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
jsonschema = { version = "0.59.0", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
pem = { version = "4.0.0", default-features = false, features = ["std"] }
# The property tests of the server's scorer, at the version FerroFED and
# FerroBRIDGE take. Verified against crates.io on 2026-10-24.
proptest = "1.12.0"
quick-xml = { version = "0.42.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# The scorer's Jaro-Winkler comparator and the folding of a name to its
# letters (docs/architecture.md section 5.2), at the versions clap and url
# already resolve. Verified against crates.io on 2026-10-24.
strsim = "0.11.1"
unicode-normalization = "0.1.26"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false }
# The OTLP span export of `[telemetry] otlp_endpoint` (#143): the tracer
# provider, its gRPC exporter and the bridge from the server's tracing spans,
# the opentelemetry crates in lockstep and tracing-opentelemetry on the line
# paired with them, as FerroFED pins them. Test-only: the OTLP trace service
# the testkit's in-process collector answers, and the gRPC server it runs on.
# Verified against crates.io on 2026-10-24.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic", "tls-aws-lc", "tls-webpki-roots"] }
opentelemetry-proto = { version = "0.33.1", default-features = false }
tonic = { version = "0.14.6", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "json", "ansi"] }
url = "2.5.8"
uuid = { version = "1.26.1", default-features = false, features = ["v4", "std"] }
wiremock = "0.6.5"
# The testkit's container harness behind FERROPIX_E2E (tools/ferropix-testkit)
# and the PostgreSQL client its end-to-end case connects with, at the
# versions FerroFED and FerroBRIDGE pin. Verified against crates.io on
# 2026-10-24.
testcontainers = "0.28.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
# The operator console's browser journeys (tools/ferropix-testkit, #98): the
# WebDriver client at the version FerroBRIDGE and FerroFED pin, and the
# process-group kill that stops each journey's chromedriver with the Chrome
# it started. The console's browser half marks the page hydrated through
# web-sys, at the version wasm-bindgen already resolves. Verified against
# crates.io on 2026-10-24.
thirtyfour = { version = "0.37.5", default-features = false, features = ["reqwest", "cdp"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
web-sys = { version = "0.3.106", default-features = false }

# The reliability bar (no specification governs it: our own design), the
# FerroHEALTH family's lint set as FerroAUTH carries it.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
# Guards, results, and causes are never dropped on the floor.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
await_holding_lock = "deny"
# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"
# Libraries speak tracing; only binaries write to stdio, and nothing exits.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# Suppressions are scoped, justified, and self-reporting.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Documentation and comment shape (RFC 505 and RFC 1574).
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# The RFC 3107 shape: derive Default when the default is a variant.
derivable_impls = "deny"
# API hygiene: no re-exports, no pointer leakage, the right std call.
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"

# The operator console's WebAssembly bundle (app/ferropix-console), built by
# cargo-leptos: optimized for size, since the browser downloads it (the Cargo
# reference, profiles; no specification governs this: our own design). It
# keeps the inherited overflow checks and drops the line tables, which
# wasm-bindgen strips from the bundle anyway.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
debug = false

# The console's development bundle, cargo-leptos's `lib-profile-dev`.
[profile.wasm-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256

# A clean 500 relies on catch_unwind, which only catches unwinding panics, and
# tests ignore the panic setting, so abort would be untestable
# (https://doc.rust-lang.org/cargo/reference/profiles.html#panic).
[profile.release]
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"
