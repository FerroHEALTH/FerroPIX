# SonarQube Cloud project configuration.
#
# Advisory analysis only: it never outranks the specifications, the project
# rules, or the local gates, and it gates no merge
# (.claude/rules/ai-code-review.md). The quality gate is the built-in
# "Sonar way" default.
#
# The analyzer sees the Rust workspace, with the coverage the workflow
# imports, and the multi-language sweep over shell, YAML, JSON, and
# markdown-adjacent config.

sonar.projectKey=FerroHEALTH_FerroPIX
sonar.organization=ferrohealth
sonar.projectName=FerroPIX
sonar.sourceEncoding=UTF-8

# Scope: analyze the tree, minus build output and any vendored input. A
# vendored tree is bytes a publisher owns and a fetch script reproduces
# (.claude/rules/vendored-inputs.md), so a finding on one is noise nobody may
# act on in place. The git-ignored .vendor-cache/ holds the texts whose
# licence keeps them out of the tree, and the raster and font files are
# binaries.
sonar.sources=.
sonar.exclusions=**/target/**,**/vendor/**,docs/specs/**,.vendor-cache/**,**/node_modules/**,**/*.png,**/*.ico,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.woff,**/*.woff2,**/*.tgz,**/*.gz,**/*.zip,**/*.pdf

# Rust coverage, imported from the instrumented nextest run that
# .github/workflows/sonar.yml writes. An absent file is reported as a warning
# by the scanner, so a run whose coverage step wrote nothing still analyzes.
sonar.rust.lcov.reportPaths=lcov.info

# Coverage scope. The coverage step runs the end-to-end cases under
# FERROPIX_E2E, and the code they reach counts as covered; the e2e test
# trees themselves (every tests/it/e2e.rs and tests/it/e2e/) are test code,
# and the testkit is test support, never shipped. The console's view layer is left out as FerroTERM did on its #825
# and #829, after FerroEHR's #2862: the app root and the pages are Leptos
# views whose islands hydrate in the browser as wasm, and the host lcov run
# sees none of the browser half. The console's server half keeps its
# coverage, and every file stays analyzed for issues and duplication.
sonar.coverage.exclusions=\
  **/tests/it/e2e.rs,\
  **/tests/it/e2e/**,\
  tools/ferropix-testkit/**,\
  app/ferropix-console/src/app.rs,\
  app/ferropix-console/src/pages/**

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version, never kept as a second hand-maintained copy here.
