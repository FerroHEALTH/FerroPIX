# The performance gate (#506), called by ci.yml on a change that reaches the
# server and by release.yml on the release commit. Each attempt job builds
# the release server of the commit and of its base, installs ferrohealth-perf
# (FerroHEALTH/FerroSYS#249) at its docs/VERSIONS.md pin and runs
# scripts/perf/gate.sh once through .github/actions/perf-attempt: the tool's
# A/B mode, the head's idle phase held to absolute limits, then pairs of
# load phases against the base and the head on the same runner, the head
# judged over the base, and the planted outbox poller the idle phase must
# fail. The base is the merge base of the commit with the `base` input, or
# with none the previous release. An attempt that ends with exit 2 could not
# be judged and says nothing about the code, so it is retried on a fresh
# runner on any CPU model. Some runners' disks sync so slowly that every
# route stalls (#511); the gate measures the runner's sync beside the run and
# a breach on such a runner exits 2 too. At most two retries run. The verdict
# job passes the gate when the last attempt that ran passed; a breach on a
# runner whose disk syncs in time fails at once, with no retry. In a merge
# group ci.yml passes `skip` and only the verdict job runs (#551). No
# specification governs this: our own design.
name: Perf

on:
  workflow_call:
    inputs:
      base:
        description: >-
          The commit or ref the base is the merge base with: the pull
          request's base, the merge group's, or the commit before a push.
          Empty takes the previous release.
        required: false
        default: ""
        type: string
      cache:
        description: Restore and save the Rust build cache; the release lane passes false.
        required: false
        default: true
        type: boolean
      skip:
        description: >-
          Build and judge nothing, and pass the verdict with a summary saying
          why; ci.yml passes true in a merge-group run.
        required: false
        default: false
        type: boolean

permissions: {}

env:
  FERROHEALTH_PERF_VERSION: 0.5.2
  FERROPIX__USAGE_REPORT__ENABLED: "false"

jobs:
  perf:
    name: perf (attempt 1)
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache && 'true' || 'false' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "1"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}

  perf-retry:
    name: perf (attempt 2)
    needs: perf
    if: needs.perf.outputs.retryable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache && 'true' || 'false' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "2"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}

  perf-retry-2:
    name: perf (attempt 3)
    needs: perf-retry
    if: needs.perf-retry.outputs.retryable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache && 'true' || 'false' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "3"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}

  # The gate passes when the last attempt that ran passed; an attempt job
  # that did not finish fails it.
  verdict:
    name: perf verdict
    needs: [perf, perf-retry, perf-retry-2]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The merge queue proves the merged tree; the gate ran on the pull
      # request and runs again on the push to main (.claude/rules/ci-cd.md).
      - name: The gate is not run in a merge group
        if: inputs.skip
        run: |
          set -euo pipefail
          {
            echo "### Performance gate skipped"
            echo
            echo "A merge-group run proves the merged tree and builds nothing for the performance gate. The gate ran on the pull request and runs on the push to main with the same thresholds."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "performance gate skipped in the merge group"
      - name: The last attempt passed
        if: ${{ !inputs.skip }}
        env:
          RESULTS: ${{ needs.perf.result }} ${{ needs.perf-retry.result }} ${{ needs.perf-retry-2.result }}
          CODES: ${{ needs.perf.outputs.code }} ${{ needs.perf-retry.outputs.code }} ${{ needs.perf-retry-2.outputs.code }}
        run: |
          set -euo pipefail
          echo "attempt results: ${RESULTS}; exit codes: ${CODES}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error title=Performance gate::an attempt did not finish"
              exit 1
              ;;
          esac
          last="$(awk '{ print $NF }' <<< "${CODES}")"
          if [ "$last" != "0" ]; then
            echo "::error title=Performance gate::the last attempt ended with exit ${last}"
            exit 1
          fi
          echo "the last attempt passed"
