# SPDX-License-Identifier: BUSL-1.1
#
# The FerroPIX quickstart: the published server image beside PostgreSQL and a
# development OpenID Provider. This one file is the whole quickstart: every
# release attaches it, and it needs Docker Compose 2.23.1 or newer, which
# reads the inlined configs at the end. Download it and start it:
#
#   curl -fsSLO https://github.com/FerroHEALTH/FerroPIX/releases/latest/download/compose.yaml
#   mkdir -p secrets && umask 077
#   openssl rand -base64 32 > secrets/ferropix-data-key
#   openssl rand -hex 16 > secrets/postgres-password
#   openssl rand -hex 16 > secrets/ferropix-db-password
#   printf 'postgresql://ferropix:%s@postgres:5432/ferropix' \
#     "$(cat secrets/ferropix-db-password)" > secrets/ferropix-db-url
#   docker compose up --wait
#   curl http://localhost:8080/health/readiness
#
# THE IMAGE. The server runs the published ghcr.io/ferrohealth/ferropix image,
# which only the release lane builds (.github/workflows/release-image.yml); no
# compose file builds it. The tag default is the product version, and
# scripts/checks/versions.sh keeps it equal to the workspace version. Pin the
# digest the release names for anything you keep.
#
# THE CONFIGURATION is the ferropix-toml config at the end of this file, a
# copy of app/ferropix-server/quickstart.toml mounted read-only:
# the production profile on http://localhost:8080, one synthetic identifier
# domain fed by the client `quickstart-source`, and the usage report stating
# `compose`. Every key is FERROPIX__<SECTION>__<KEY> in the environment
# (https://ferropix.eu/docs/operate/configuration.html).
#
# SECRETS. The four files under ./secrets are yours to create before the first
# `docker compose up`, as above; compose refuses to start a service whose
# secret source is missing. Each is mounted under /run/secrets/ and read from
# there, never from the environment. Never commit them (.gitignore keeps
# ./secrets out).
#
# THE CONSOLE. The `console` profile runs the operator console
# (ghcr.io/ferrohealth/ferropix-console) beside the server, signed in through
# the same development issuer; it needs a fifth secret file, the console's
# client secret, which the issuer accepts whatever it holds:
#
#   openssl rand -hex 16 > secrets/console-oidc-client-secret
#   docker compose --profile console up --wait
#   open http://localhost:3000/
#
# THE HL7 v2 FACE. The `hl7v2` profile runs FerroTERM, the family's FHIR
# terminology server, beside the server, and the face translates every v2
# table value on it (https://ferropix.eu/docs/integrate/hl7v2-face.html).
# Load it with HL7 Terminology, the v2-to-FHIR guide's package and
# FerroBRIDGE's value package of the ferrobridge-hl7v2 FerroPIX runs, each
# in its own directory under ./terminology:
#
#   mkdir -p terminology/hl7.terminology terminology/hl7.fhir.uv.v2mappings \
#     terminology/ferrobridge-hl7v2-values
#   curl -sL https://packages.fhir.org/hl7.terminology/7.5.0 \
#     | tar -xz -C terminology/hl7.terminology
#   curl -sL https://packages.fhir.org/hl7.fhir.uv.v2mappings/1.0.0 \
#     | tar -xz -C terminology/hl7.fhir.uv.v2mappings
#   curl -sL https://codeload.github.com/FerroHEALTH/FerroBRIDGE/tar.gz/8de54079117d76491171f93257e0008559a01913 \
#     | tar -xz -C terminology/ferrobridge-hl7v2-values --strip-components=3 \
#       FerroBRIDGE-8de54079117d76491171f93257e0008559a01913/terminology/hl7v2-values
#   FERROPIX__HL7V2__ENABLED=true \
#     FERROPIX__TERMINOLOGY__ENDPOINT__URL=http://localhost:8280/r4 \
#     docker compose --profile hl7v2 up --wait
#
# The face listens on port 2575 for the sender quickstart.toml lists
# (QUICKSTART at HOSPITAL, feeding the quickstart hospital domain).
#
# THE ISSUER. The server reads its authorization server's metadata at start and
# accepts plain http only on loopback (RFC 8414 §2), so the development
# provider, NAV's mock-oauth2-server, owns the network namespace and the server
# joins it: both see the provider at http://localhost:8180/ferropix, as your
# browser and your shell do. It signs any client credentials request and any
# login: a development issuer, NOT for anything real. For a deployment, name
# your own https issuer in [[auth.issuer]] and drop the service.
#
#   curl -s -d grant_type=client_credentials -d client_id=quickstart-source \
#     -d client_secret=any -d scope=system/Patient.rs \
#     http://localhost:8180/ferropix/token
#
# PORTS. Every published port binds the loopback interface by default. A
# published port is DNAT'd ahead of the host firewall's own chains, so a port on
# 0.0.0.0 is reachable from the network even when the firewall says otherwise
# (https://docs.docker.com/engine/network/packet-filtering-firewalls/). The
# server's and the console's ports are published on the issuer service, whose
# network namespace both share.
#
# HEALTH. The server's healthcheck runs `ferropix healthcheck`, which asks
# GET /health/readiness: 200 once the store and the audit spool answer. It is
# declared on each service as well as in the image: the OCI image
# configuration only reserves its Healthcheck field "to maintain
# compatibility" (https://github.com/opencontainers/image-spec/blob/main/config.md),
# Podman runs the published image with no healthcheck, and a `service_healthy`
# dependent would then never start.
#
# IMAGES. Every image is pinned by tag and by the digest of its image index,
# and each pin is a row of docs/VERSIONS.md that scripts/checks/versions.sh
# holds equal to this file.

# Without this the project is named after the directory the file sits in, and
# the container, network and volume names move when the directory does.
name: ferropix

services:
  # The development OpenID Provider, and the owner of the network namespace
  # the server joins.
  issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5@sha256:d88e445d55c4ff6eed59b02d86adfece47d985233b1616fb712669b98328c8a2
    restart: unless-stopped
    ports:
      - "${FERROPIX_BIND_HOST:-127.0.0.1}:${FERROPIX_PORT:-8080}:8080"
      - "${FERROPIX_BIND_HOST:-127.0.0.1}:${FERROPIX_ISSUER_PORT:-8180}:8180"
      # The console's port, which answers only under the `console` profile.
      - "${FERROPIX_BIND_HOST:-127.0.0.1}:${FERROPIX_CONSOLE_PORT:-3000}:3000"
      # The HL7 v2 face's MLLP port, which answers only with
      # FERROPIX__HL7V2__ENABLED=true.
      - "${FERROPIX_BIND_HOST:-127.0.0.1}:${FERROPIX_MLLP_PORT:-2575}:2575"
    environment:
      # The server listens on 8080 in this namespace, so the provider moves.
      SERVER_PORT: "8180"
      # A login form for the browser and two token callbacks. The client
      # credentials grant: the client as `sub` and `client_id`, the server's
      # audience, and the scope asked for. A console login and its renewal:
      # the person who signed in as `sub`, the console as `aud` and
      # `client_id`, since the provider signs the ID Token with the same
      # claims and the console holds it to its own client id alone, and the
      # steward scope. `$$` is a literal `$` to compose.
      JSON_CONFIG: >-
        {"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"ferropix",
        "requestMappings":[{"requestParam":"grant_type","match":"client_credentials",
        "claims":{"sub":"$${clientId}","client_id":"$${clientId}",
        "aud":["http://localhost:8080/fhir"],"scope":"$${scope}"}},
        {"requestParam":"grant_type","match":"authorization_code|refresh_token",
        "claims":{"client_id":"$${clientId}","aud":["$${clientId}"],
        "scope":"openid __ferropix.steward"}}]}]}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Writes the inlined server configuration onto the ferropix-config volume
  # and exits. Compose refuses an inlined config in a read-only service ("only
  # `file` is supported"), so this one-shot copy is what lets the server keep
  # its read-only root filesystem while compose.yaml stays one file. It runs
  # the pinned PostgreSQL image below for its `cp`, with no network. A later
  # `up` runs it again over the read-only copy the first one wrote: `-f`
  # replaces the file, which needs no capability the service dropped.
  config:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    entrypoint: ["cp", "-f", "/ferropix.toml", "/etc/ferropix/ferropix.toml"]
    network_mode: none
    configs:
      - source: ferropix-toml
        target: /ferropix.toml
    volumes:
      - ferropix-config:/etc/ferropix
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  ferropix:
    image: ghcr.io/ferrohealth/ferropix:${FERROPIX_VERSION:-0.0.30}
    container_name: ferropix
    restart: unless-stopped
    network_mode: service:issuer
    depends_on:
      config:
        condition: service_completed_successfully
      issuer:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      FERROPIX_CONFIG: /etc/ferropix/ferropix.toml
      # The image sets the same value; repeated so `docker compose config`
      # shows the address the server binds.
      FERROPIX__SERVER__LISTEN: 0.0.0.0:8080
      FERROPIX__TELEMETRY__FILTER: ${FERROPIX_LOG_FILTER:-info}
      # The installation report to FerroPULSE: on by default, and
      # FERROPIX__USAGE_REPORT__ENABLED=false in your shell or .env stops it.
      # What it sends and when:
      # https://ferropix.eu/docs/operate/configuration.html#usage_report
      FERROPIX__USAGE_REPORT__ENABLED: ${FERROPIX__USAGE_REPORT__ENABLED:-true}
      FERROPIX__USAGE_REPORT__DEPLOYMENT: compose
      FERROPIX__USAGE_REPORT__STATE_DIR: /var/lib/ferropix
      # The HL7 v2 face and the terminology server it translates on, passed
      # through when set (THE HL7 v2 FACE above).
      FERROPIX__HL7V2__ENABLED:
      FERROPIX__TERMINOLOGY__ENDPOINT__URL:
    secrets:
      - ferropix-db-url
      - ferropix-data-key
    volumes:
      # The configuration the config service writes (below), read-only here.
      - ferropix-config:/etc/ferropix:ro
      # The audit spool and the usage report's instance id, owned by the
      # image's runtime user (uid 65532), so a fresh named volume is writable.
      - ferropix-state:/var/lib/ferropix
    # The server writes only to the volume above; every secret is read once at
    # boot. Should a feature ever need another writable path, mount it for
    # that path alone rather than dropping this line.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The image's HEALTHCHECK, repeated for Podman (HEALTH above).
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferropix", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Longer than the drain of [server] drain_delay and shutdown_timeout.
    stop_grace_period: 20s

  # The operator console, a client of the server's operator API that
  # stewards sign in to with OpenID Connect. It joins the issuer's network
  # namespace as the server does, because it too admits a plain `http`
  # provider only on loopback, and reaches the server there. Its healthcheck
  # runs `ferropix-console healthcheck`, the image's HEALTHCHECK repeated for
  # Podman (HEALTH above).
  console:
    image: ghcr.io/ferrohealth/ferropix-console:${FERROPIX_VERSION:-0.0.30}
    profiles: [console]
    restart: unless-stopped
    network_mode: service:issuer
    depends_on:
      ferropix:
        condition: service_healthy
    environment:
      # The image sets the same value; repeated so `docker compose config`
      # shows the address the console binds.
      FERROPIX_CONSOLE__SERVER__LISTEN: 0.0.0.0:3000
      FERROPIX_CONSOLE__PIX__BASE_URL: http://localhost:8080/
      FERROPIX_CONSOLE__OIDC__ISSUER: http://localhost:8180/ferropix
      FERROPIX_CONSOLE__OIDC__AUTHORIZATION_ENDPOINT: http://localhost:8180/ferropix/authorize
      FERROPIX_CONSOLE__OIDC__TOKEN_ENDPOINT: http://localhost:8180/ferropix/token
      FERROPIX_CONSOLE__OIDC__JWKS_URI: http://localhost:8180/ferropix/jwks
      FERROPIX_CONSOLE__OIDC__END_SESSION_ENDPOINT: http://localhost:8180/ferropix/endsession
      FERROPIX_CONSOLE__OIDC__CLIENT_ID: ferropix-console
      FERROPIX_CONSOLE__OIDC__CLIENT_SECRET_FILE: /run/secrets/console-oidc-client-secret
      FERROPIX_CONSOLE__OIDC__REDIRECT_URI: http://localhost:3000/auth/callback
      FERROPIX_CONSOLE__OIDC__POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
      # Plain http on loopback, which the console admits nowhere else; behind
      # an https proxy, leave it unset so the session cookie carries Secure.
      FERROPIX_CONSOLE__SESSION__SECURE_COOKIE: "false"
    secrets:
      - console-oidc-client-secret
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferropix-console", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # The console keeps its sessions in memory and writes no file.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The FHIR terminology server the HL7 v2 face translates every table value
  # on, under the `hl7v2` profile. It joins the issuer's network namespace,
  # so the server reaches it on loopback (http://localhost:8280/r4), the one
  # place FerroPIX admits a plain `http` terminology server.
  terminology:
    image: ghcr.io/ferrohealth/ferroterm:0.4.2@sha256:1853486ae6f85a66424561cbf90f9905027c38d506bdeb24a9e1a831b4b97424
    profiles: [hl7v2]
    restart: unless-stopped
    network_mode: service:issuer
    depends_on:
      issuer:
        condition: service_started
    environment:
      FERROTERM__SERVER__LISTEN: 127.0.0.1:8280
      FERROTERM__TERMINOLOGY__CODE_SYSTEMS: /data/packages/hl7.terminology/package,/data/packages/hl7.fhir.uv.v2mappings/package,/data/packages/ferrobridge-hl7v2-values
      # The installation report follows FerroPIX's own switch.
      FERROTERM__USAGE_REPORT__ENABLED: ${FERROPIX__USAGE_REPORT__ENABLED:-true}
      FERROTERM__USAGE_REPORT__DEPLOYMENT: compose
      FERROTERM__USAGE_REPORT__STATE_DIR: /data/state
    volumes:
      - type: bind
        source: ${FERROPIX_TERMINOLOGY_DIR:-./terminology}
        target: /data/packages
        read_only: true
      - ferroterm-state:/data/state
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroterm", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The cross-reference store. The server connects as the `ferropix` role
  # the ferropix-role config creates on the first start; the
  # superuser's password is the postgres-password secret.
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferropix
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
      - ferropix-db-password
    volumes:
      - postgres-data:/var/lib/postgresql
    configs:
      - source: ferropix-role
        target: /docker-entrypoint-initdb.d/10-ferropix-role.sh
        # Executable, so the entrypoint runs the script rather than sourcing
        # it into its own shell.
        mode: 0555
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ferropix"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    # The entrypoint starts as root to fix ownership and drops to the postgres
    # user itself, so this image keeps the capabilities that needs and gains
    # no new ones.
    security_opt:
      - no-new-privileges:true

secrets:
  # The connection URL the server reads through FERROPIX__DB__URL_FILE, the
  # ferropix role's password included.
  ferropix-db-url:
    file: ${FERROPIX_DB_URL_FILE:-./secrets/ferropix-db-url}
  # The sealing key of the identifying values: the base64 of 32 random bytes.
  ferropix-data-key:
    file: ${FERROPIX_DATA_KEY_FILE:-./secrets/ferropix-data-key}
  # The PostgreSQL superuser's password, read by the official image.
  postgres-password:
    file: ${FERROPIX_POSTGRES_PASSWORD_FILE:-./secrets/postgres-password}
  # The ferropix role's password, read once by the init script.
  ferropix-db-password:
    file: ${FERROPIX_DB_PASSWORD_FILE:-./secrets/ferropix-db-password}
  # The console's OIDC client secret at the issuer, read once at boot.
  console-oidc-client-secret:
    file: ${FERROPIX_CONSOLE_OIDC_CLIENT_SECRET_FILE:-./secrets/console-oidc-client-secret}

# Every file the quickstart needs is inlined here, so compose.yaml runs alone
# with no checkout. Each copy names its source in the repository, which the
# tests and the chart read, and scripts/quickstart/compose-configs.sh holds
# the copy to it (`--write` rewrites them).
configs:
  # The server's configuration (THE CONFIGURATION above).
  ferropix-toml:
    # source: app/ferropix-server/quickstart.toml
    content: |
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1

      # The quickstart configuration of the FerroPIX server: a production profile
      # on the loopback base, with both secrets read from the files a container
      # runtime mounts. `ferropix config check --config quickstart.toml` accepts it
      # once the two files exist. Every key and its default is listed in the book,
      # https://ferropix.eu/docs/operate/configuration.html.

      profile = "production"
      public_base_url = "http://localhost:8080"

      [server]
      listen = "0.0.0.0:8080"

      [db]
      url_file = "/run/secrets/ferropix-db-url"
      # The sealing key: the base64 of 32 random bytes, `openssl rand -base64 32`.
      data_key_file = "/run/secrets/ferropix-data-key"

      # The development OpenID Provider the compose quickstart runs beside the
      # server on the same loopback interface (compose.yaml, the `issuer` service).
      # It signs the client credentials tokens of the Sources and the logins of the
      # console, so it is a `persons` issuer: a token whose `sub` is its client is
      # a machine's (RFC 9068 §2.2), and a login is admitted through the console,
      # the one client `first_party_clients` lists. It signs its access tokens with
      # `typ` JWT rather than the `at+jwt` of RFC 9068, and names the client in
      # `client_id` or `azp`, so the issuer takes the claims it carries; an issuer
      # of RFC 9068 tokens keeps the profile's own `token_types`,
      # `required_claims` and `client_claims`. It signs a login's access token
      # with the ID Token's claims, so the console's own client id is the second
      # audience: a provider that audiences a login's access token to the server
      # needs only the first.
      [[auth.issuer]]
      issuer = "http://localhost:8180/ferropix"
      kind = "persons"
      profile = "rfc9068"
      audience = ["http://localhost:8080/fhir", "ferropix-console"]
      token_types = ["JWT"]
      required_claims = ["iss", "exp", "aud", "sub"]
      client_claims = ["client_id", "azp"]
      first_party_clients = ["ferropix-console"]

      # The clients the development issuer may vouch for as the Source of a
      # domain (PIXm 3.1.0 §2:3.104.5).
      [[trust.issuer]]
      issuer = "http://localhost:8180/ferropix"
      clients = ["quickstart-source"]

      # An identifier domain under the OID arc 2.999, which ITU-T X.660 reserves
      # for examples, so the quickstart names no real assigning authority.
      [[domain]]
      system = "urn:oid:2.999.1.1"
      name = "Quickstart hospital"
      kind = "local"
      source_client_id = "quickstart-source"

      # The BSN, the national number of the Netherlands (NL Generic Functions,
      # the Identification page): authoritative, so a BSN two records carry links
      # them, and sealed at rest. Its values must pass the eleven-proof.
      [[domain]]
      system = "http://fhir.nl/fhir/NamingSystem/bsn"
      name = "BSN"
      kind = "authoritative"
      source_client_id = "quickstart-source"
      sensitive = true

      # The pseudonymised BSN of the Generic Functions, held as an identifier of
      # its own, fed by the system that obtained it. FerroPIX calls no BSNk
      # service.
      [[domain]]
      system = "http://fhir.nl/fhir/NamingSystem/pseudo-bsn"
      name = "Pseudonymised BSN"
      kind = "authoritative"
      source_client_id = "quickstart-source"
      sensitive = true

      # The HL7 v2 face, off until FERROPIX__HL7V2__ENABLED=true with a
      # terminology server named in FERROPIX__TERMINOLOGY__ENDPOINT__URL (compose.yaml,
      # the `hl7v2` profile). One sender feeds the quickstart hospital domain,
      # whose assigning authority namespace id is QUICKHOSP.
      [hl7v2]
      enabled = false

      [[hl7v2.senders]]
      application = "QUICKSTART"
      facility = "HOSPITAL"
      domain = "urn:oid:2.999.1.1"

      [hl7v2.namespaces]
      "urn:oid:2.999.1.1" = "QUICKHOSP"

      # The steward's API, which the console reads and writes (compose.yaml, the
      # `console` profile).
      [operator]
      enabled = true

      [usage_report]
      deployment = "compose"
      state_dir = "/var/lib/ferropix"
  # The database role, run once by the PostgreSQL image's entrypoint when it
  # initialises an empty data directory.
  ferropix-role:
    # source: docker/postgres/10-ferropix-role.sh
    content: |
      #!/usr/bin/env bash
      # SPDX-FileCopyrightText: Cadasto B.V.
      # SPDX-License-Identifier: BUSL-1.1
      #
      # The quickstart's database role, run once by the official PostgreSQL image
      # when it initialises an empty data directory (compose.yaml mounts this file
      # under /docker-entrypoint-initdb.d/). The server refuses a superuser at boot,
      # because a superuser reads every schema, so it connects as `ferropix`, a
      # login role that may create the `pix` schema in the `ferropix` database and
      # owns nothing else. The password is the file secret ferropix-db-password,
      # which psql reads itself, so it reaches neither the environment nor a
      # command line; the URL in the ferropix-db-url secret carries the same one.
      # No specification governs this: our own design.
      set -euo pipefail

      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
      \set password `cat /run/secrets/ferropix-db-password`
      CREATE ROLE ferropix LOGIN PASSWORD :'password';
      GRANT CREATE ON DATABASE ferropix TO ferropix;
      SQL

volumes:
  ferropix-config:
  ferropix-state:
  postgres-data:
  ferroterm-state:
