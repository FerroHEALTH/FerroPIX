[package]
name = "ferropix-testkit"
description = "Test support for the FerroPIX suites: the container harness behind FERROPIX_E2E, the synthetic fixtures and their guard, the test OpenID Provider and the console's browser journeys; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# A tool crate is never published, whatever the workspace switch says; a
# suite takes it as a path-only dev-dependency.
publish = false

[dependencies]
# The in-process OTLP collector (`otlp`): the OTLP/gRPC trace service on a
# loopback port, keeping every span it receives.
async-trait.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace"] }
tonic = { workspace = true, features = ["server", "router"] }
# The test OpenID Provider (`oidc`): its ES256 key generated per run, the
# random codes, the PKCE check, the signed ID Tokens and the wiremock issuer
# they are served from.
aws-lc-rs.workspace = true
base64.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
url.workspace = true
wiremock.workspace = true
# The FHIR R4 model every fixture decodes into, with the `resources` root
# set for Patient, Bundle and MessageHeader.
fhir-types = { workspace = true, features = ["r4", "resources"] }
# The naming systems of the BSN the fixture guard holds to the synthetic
# range (`identification`, built with `nvi`).
nl-generic-functions = { path = "../../crates/nl-generic-functions", features = ["nvi"] }
# The readiness probe of the stub provider and its token request, a form
# post (RFC 6749 §4.4.2).
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
testcontainers.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt", "net", "sync"] }

[dev-dependencies]
# The browser journeys run the console in process, against its release site
# bundle, and drive headless Chrome through a chromedriver of their own.
ferropix-console = { path = "../../app/ferropix-console" }
rustix.workspace = true
tempfile.workspace = true
thirtyfour.workspace = true
# The end-to-end case connects to the started PostgreSQL and reads its
# version.
sqlx.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "net"] }

[lints]
workspace = true
