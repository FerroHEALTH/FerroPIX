<!-- The FerroPIX mark: an index card with the patient on it and their identifiers beside
     them. The product is a Master Patient Index, and identifying data lives on
     the index, outside the record. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="FerroPIX icon">
  <title>FerroPIX</title>
  <rect x="8" y="14" width="48" height="42" rx="6" fill="none" stroke="#6B21A8" stroke-width="4.6"/>
  <path d="M8 20 V14 a6 6 0 0 1 6 -6 h14 v12 Z" fill="#6B21A8"/>
  <circle cx="22" cy="34" r="5" fill="#C084FC"/>
  <path d="M14 48 a8 8 0 0 1 16 0" fill="none" stroke="#C084FC" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M37 32 H48 M37 41 H48" fill="none" stroke="#C084FC" stroke-width="4.2" stroke-linecap="round"/>
</svg>
