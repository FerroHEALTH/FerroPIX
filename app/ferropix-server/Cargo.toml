[package]
name = "ferropix-server"
description = "The FerroPIX server: the Master Patient Index over IHE PIXm and PDQm, with its cross-reference in PostgreSQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The application is never published.
publish = false

# A thin main.rs over a testable lib.rs (the Rust book, ch. 12.3, "Separation
# of Concerns for Binary Projects").
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferropix"
path = "src/main.rs"

[dependencies]
# The sealing of identifier values at rest: AES-256-GCM, HMAC-SHA256 and
# HKDF-SHA256 (docs/architecture.md §4.2).
aws-lc-rs.workspace = true
axum.workspace = true
# The sealing key file holds the base64 of its 32 bytes; the audit tests read
# back a search's base64 query entity.
base64.workspace = true
clap.workspace = true
# The R4 OperationOutcome and CapabilityStatement the FHIR face answers, and
# the AuditEvent the audit tests read back, from the generated model.
fhir-types = { workspace = true, features = ["r4", "terminology", "resources"] }
# The BALP records of the Manager and the Supplier, their ITI-20 spool and
# the FHIR Feed to the audit repository (FerroAUDIT).
ihe-atna = { workspace = true, features = ["balp"] }
# The readiness document and the dependency report, shared with the
# operator console.
ferropix-operator-api = { path = "../ferropix-operator-api" }
# The `[auth]` section is resolved by the family's resource-server crate: the
# issuer URL rule of RFC 8414, the audiences, the algorithms and the Basic
# users of the development profile. `axum` adds the layer that guards every
# route of the FHIR face and the operator API, and `fetch` reads each
# issuer's metadata and key set.
ferrohealth-smart = { workspace = true, features = ["axum", "fetch"] }
http.workspace = true
# The date the capability statement carries.
jiff.workspace = true
# The signature algorithms the `[auth]` section names.
jsonwebtoken.workspace = true
# The `healthcheck` job asks the server beside it for its readiness.
reqwest = { workspace = true, features = ["rustls"] }
secrecy.workspace = true
serde.workspace = true
# The bodies of the FHIR face, written from the generated model, and the
# demographics a source record version carries, stored as jsonb.
serde_json.workspace = true
# The cross-reference store: PostgreSQL 18 with the embedded migration set,
# uuid ids and jsonb demographics, over rustls for a `sslmode=require` URL.
sqlx = { workspace = true, features = ["macros", "migrate", "uuid", "json", "tls-rustls-aws-lc-rs"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml.workspace = true
# The family's middleware: the request id, the panic catch, the request
# timeout and the body ceiling.
tower-http = { workspace = true, features = ["request-id", "catch-panic", "timeout", "limit"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
# The request id minted for a request that brings none, and the store's ids.
uuid.workspace = true

[dev-dependencies]
# PostgreSQL behind FERROPIX_E2E, and the synthetic BSNs, names and domains
# the store cases and the request-log test send.
ferropix-testkit = { path = "../../tools/ferropix-testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "process", "test-util"] }
tower = { workspace = true, features = ["util"] }
# The authorization server the authorization tests stand up.
wiremock.workspace = true

[lints]
workspace = true
