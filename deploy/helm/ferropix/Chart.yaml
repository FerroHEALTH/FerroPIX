apiVersion: v2
name: ferropix
description: >-
  FerroPIX, the FerroHEALTH Master Patient Index over IHE PIX, PIXm, PDQ and
  PDQm, with its cross-reference in an external PostgreSQL 18, and its
  operator console. The server runs as a non-root, read-only-rootfs workload;
  every credential is a Secret read through a file.
type: application
# The chart's own version line, SemVer over its values and rendered output
# (https://helm.sh/docs/topics/charts/#charts-and-versioning).
version: 0.2.0
# The default image tag of the server and the console: the product version,
# which scripts/checks/versions.sh holds equal to the workspace version.
appVersion: "0.0.5"
# PodDisruptionBudget.unhealthyPodEvictionPolicy is stable from 1.31
# (KEP-3017), the newest field this chart renders.
kubeVersion: ">=1.31.0-0"
keywords:
  - ihe
  - pix
  - pdq
  - mpi
  - fhir
  - hl7v2
home: https://ferropix.eu
sources:
  - https://github.com/FerroHEALTH/FerroPIX
maintainers:
  - name: Cadasto B.V.
    email: info@cadasto.com
